<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="__MEDIA_BASE_URL__/">
<title>Caderno Interativo de Estudo - Invita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17181C;
  --navy:#1B1D30;
  --navy-deep:#101120;
  --navy-soft:#262943;
  --espresso:#4A2E22;
  --espresso-light:#7A5240;
  --gold:#C6A15B;
  --gold-light:#E4C989;
  --cream:#F6F0E3;
  --paper:#FFFFFF;
  --paper-warm:#FDFBF7;
  --muted:#6B6D7A;
  --line:rgba(23,24,28,0.10);
  --line-soft:rgba(23,24,28,0.06);
  --success:#4F9C6D;
  --success-bg:#EAF4EE;
  --danger:#B4503D;
  --danger-bg:#FBEDE9;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --font-scale:1;
  --shadow-soft:0 20px 50px rgba(16,17,32,0.14), 0 2px 8px rgba(16,17,32,0.06);
  --shadow-card:0 8px 24px rgba(16,17,32,0.08);
}
*{box-sizing:border-box;}
html,body{height:100%; overflow-x:hidden; width:100%;}
body{
  margin:0;
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-size:calc(16px * var(--font-scale));
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
#app{display:flex;flex-direction:column;min-height:100vh; overflow-x:hidden;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:12px 22px;
  background:rgba(253,251,247,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.icon-btn{
  background:transparent; border:1px solid rgba(74,46,34,0.3);
  color:var(--espresso); width:38px; height:38px; border-radius:10px;
  font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .2s, transform .15s; flex:0 0 auto;
}
.icon-btn:hover{background:rgba(74,46,34,0.08); transform:translateY(-1px);}
.icon-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
.brand{display:flex; align-items:center; gap:9px; flex:0 0 auto; white-space:nowrap; cursor:pointer;}
.brand-mark{width:30px; height:30px; border-radius:8px; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:15px;}
.brand-text{font-size:12.5px; letter-spacing:.05em; color:var(--muted); font-weight:600; text-transform:uppercase;}
.brand-text b{color:var(--ink); font-weight:700;}
.progress-wrap{
  flex:1 1 auto; height:7px; background:var(--line);
  border-radius:6px; overflow:hidden; min-width:50px;
}
.progress-bar{
  height:100%; width:0%; background:linear-gradient(90deg,var(--espresso),var(--gold));
  transition:width .5s ease; border-radius:6px;
}
.read-counter{
  font-size:12px; letter-spacing:.03em; color:var(--muted);
  white-space:nowrap; flex:0 0 auto; font-weight:600; font-variant-numeric:tabular-nums;
}
.font-controls{display:flex; gap:6px; flex:0 0 auto;}
.font-controls button{
  background:transparent; border:1px solid rgba(74,46,34,0.3); color:var(--espresso);
  border-radius:8px; width:32px; height:32px; font-family:inherit; font-weight:700;
  cursor:pointer; font-size:12px;
}
.font-controls button:hover{background:rgba(74,46,34,0.08);}

/* ---------- SIDE MENU ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(16,17,32,0.5);
  opacity:0; pointer-events:none; transition:opacity .25s; z-index:35;
}
.overlay.open{opacity:1; pointer-events:auto;}
.side-menu{
  position:fixed; top:0; left:0; height:100%; width:310px; max-width:85vw;
  background:linear-gradient(175deg, var(--navy), var(--navy-deep));
  border-right:1px solid rgba(198,161,91,0.25);
  transform:translateX(-105%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  z-index:40; padding:24px 16px; overflow-y:auto;
}
.side-menu.open{transform:translateX(0);}
.side-menu h3{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--gold-light); margin:6px 6px 14px; font-weight:700; font-family:'Inter',sans-serif;
}
.side-menu .menu-divider{height:1px; background:rgba(198,161,91,0.18); margin:18px 4px;}
.menu-item{
  display:flex; align-items:center; gap:11px; width:100%;
  background:transparent; border:none; color:rgba(246,240,227,0.88);
  text-align:left; padding:11px 11px; border-radius:11px; cursor:pointer;
  font-family:inherit; font-size:14px; margin-bottom:2px;
  transition:background .15s; text-decoration:none;
}
.menu-item:hover{background:rgba(198,161,91,0.13);}
.menu-item.active{background:rgba(198,161,91,0.22); color:var(--gold-light); font-weight:600;}
.menu-item .m-icon{font-size:16px; width:20px; text-align:center; flex:0 0 auto;}
.menu-item .m-check{margin-left:auto; color:#7fbf8f; font-size:12px; flex:0 0 auto;}
.menu-item.nested{padding-left:30px; font-size:13.3px;}
.menu-cat-header{
  display:flex; align-items:center; gap:10px; padding:11px 11px 11px;
  margin-top:16px; border-radius:11px; cursor:pointer;
  font-weight:700; font-size:12.5px; color:var(--gold-light);
  text-transform:uppercase; letter-spacing:.05em; transition:background .15s;
}
.menu-cat-header:hover{background:rgba(198,161,91,0.1);}
.menu-cat-header:first-of-type{margin-top:2px;}
.menu-cat-header .m-icon{font-size:17px;}
.menu-cat-header.active-cat{color:#fff;}
.menu-cat-header.expanded{background:rgba(198,161,91,0.09);}
.menu-cat-header .cat-chevron{margin-left:auto; font-size:11px; color:rgba(246,240,227,0.4); transition:transform .15s;}
.menu-cat-header.expanded .cat-chevron{color:var(--gold-light);}
.menu-cat-soon{
  display:flex; align-items:center; gap:10px; padding:10px 11px; margin-top:14px;
  opacity:.42; font-size:12.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:rgba(246,240,227,0.7);
}
.menu-cat-soon .soon-tag{margin-left:auto; font-size:10px; font-weight:600; text-transform:none; letter-spacing:0; background:rgba(246,240,227,0.1); padding:2px 8px; border-radius:8px;}

/* ---------- MAIN / PAGE ---------- */
main.page-container{
  flex:1; display:flex; justify-content:center; padding:30px 18px 40px;
}
.book{
  width:100%; max-width:760px; min-height:70vh;
  background:var(--paper-warm);
  border:1px solid var(--line-soft);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);
  padding:52px 58px 46px;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  max-height:80vh;
}
.book.dark{
  background:linear-gradient(165deg, var(--navy), var(--navy-deep));
  color:var(--cream);
  border-color:rgba(198,161,91,0.2);
}
.book{scrollbar-width:auto; scrollbar-color:var(--gold) rgba(74,46,34,0.12);}
.book::-webkit-scrollbar{width:14px;}
.book::-webkit-scrollbar-track{background:rgba(74,46,34,0.08); border-radius:8px;}
.book::-webkit-scrollbar-thumb{background:var(--gold); border-radius:8px; border:3px solid var(--paper-warm);}
.book::-webkit-scrollbar-thumb:hover{background:var(--espresso);}
.book.dark::-webkit-scrollbar-track{background:rgba(198,161,91,0.1);}
.book.dark::-webkit-scrollbar-thumb{background:var(--gold-light); border:3px solid var(--navy);}
.book.dark::-webkit-scrollbar-thumb:hover{background:var(--gold);}
.book.dark{scrollbar-color:var(--gold-light) rgba(198,161,91,0.1);}

.scroll-cue{position:sticky; bottom:6px; left:0; right:0; display:flex; justify-content:center; pointer-events:none; z-index:6; height:0; overflow:visible;}
.scroll-cue-pill{background:linear-gradient(90deg,var(--gold),var(--gold-light)); color:var(--navy-deep); font-weight:800; font-size:12.5px; padding:9px 18px; border-radius:22px; box-shadow:0 8px 22px rgba(198,161,91,0.55), 0 2px 6px rgba(16,17,32,0.2); display:flex; align-items:center; gap:7px; animation:scrollCueBounce 1.3s ease-in-out infinite; letter-spacing:.01em;}
@keyframes scrollCueBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

.page-fade{opacity:0; transform:translateY(12px);}
.page-show{opacity:1; transform:translateY(0); transition:opacity .45s ease, transform .45s ease;}

.read-tag{
  position:absolute; top:22px; right:24px;
  background:var(--success-bg); color:var(--success);
  border:1px solid rgba(79,156,109,0.35);
  font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:20px;
  letter-spacing:.03em;
}
.kicker{
  color:var(--espresso); text-transform:uppercase; font-size:12px;
  letter-spacing:.12em; font-weight:700; margin-bottom:12px;
}
.book.dark .kicker{color:var(--gold-light);}
h1.page-title{
  font-size:calc(32px * var(--font-scale)); font-weight:600; margin:0 0 8px; line-height:1.16;
  color:var(--navy); text-wrap:balance;
}
.book.dark h1.page-title{color:var(--cream);}
h2.section-title{
  font-size:20px; font-weight:600; color:var(--navy); margin:34px 0 14px;
  display:flex; align-items:center; gap:9px; text-wrap:balance;
}
.book.dark h2.section-title{color:var(--gold-light);}
h2.section-title:first-of-type{margin-top:28px;}
p{margin:0 0 15px; color:var(--ink); max-width:64ch;}
.book.dark p{color:rgba(246,240,227,0.92);}
strong{color:var(--navy); font-weight:700;}
.book.dark strong{color:var(--gold-light);}
ul.styled, ol.styled{margin:0 0 16px; padding-left:0; list-style:none;}
ul.styled li, ol.styled li{
  position:relative; padding:8px 0 8px 26px; border-bottom:1px solid var(--line-soft);
  font-size:15px;
}
ul.styled li:last-child, ol.styled li:last-child{border-bottom:none;}
ul.styled li::before{content:'—'; position:absolute; left:0; color:var(--gold); font-weight:700;}
ol.styled{counter-reset:steps;}
ol.styled li{counter-increment:steps;}
ol.styled li::before{content:counter(steps); position:absolute; left:0; top:8px; width:18px; height:18px; background:var(--espresso); color:#fff; border-radius:50%; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center;}

/* spec table */
table.spec-table{width:100%; border-collapse:collapse; margin:6px 0 20px; font-size:14.5px;}
table.spec-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:0 12px 10px 0; font-weight:700; border-bottom:2px solid var(--espresso);}
table.spec-table td{padding:11px 12px 11px 0; border-bottom:1px solid var(--line-soft); font-variant-numeric:tabular-nums;}
table.spec-table tr:last-child td{border-bottom:none;}
table.spec-table td:first-child{color:var(--muted); font-weight:500;}
table.spec-table td:not(:first-child){font-weight:600; color:var(--navy);}
.book.dark table.spec-table td:not(:first-child){color:var(--gold-light);}
.table-scroll{overflow-x:auto;}

/* callout */
.callout{border-radius:var(--radius-md); padding:16px 18px; margin:18px 0; display:flex; gap:12px; border:1px solid; font-size:14.5px;}
.callout .c-icon{flex:0 0 auto; font-size:18px; line-height:1.4;}
.callout.warn{background:#FCF3E4; border-color:#E8C98C; color:#7A5A1E;}
.callout.danger{background:var(--danger-bg); border-color:#E3B3A6; color:var(--danger);}
.callout.info{background:#EEF1F8; border-color:#C7D0E8; color:#3B4A78;}
.callout p{margin:0; color:inherit; max-width:none;}

/* diff / feature grid */
.feature-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:8px 0 22px;}
@media (max-width:600px){.feature-grid{grid-template-columns:1fr;}}
.feature-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 17px; box-shadow:var(--shadow-card);}
.book.dark .feature-card{background:rgba(255,255,255,0.05); border-color:rgba(198,161,91,0.2);}
.feature-card .f-icon{font-size:20px; margin-bottom:8px; display:block;}
.feature-card h4{margin:0 0 5px; font-size:14.5px; font-weight:700; color:var(--navy); font-family:'Inter',sans-serif;}
.book.dark .feature-card h4{color:var(--gold-light);}
.feature-card p{margin:0; font-size:13.5px; color:var(--muted); max-width:none;}
.book.dark .feature-card p{color:rgba(246,240,227,0.75);}

/* stat row (cover) */
.stat-row{display:flex; gap:0; margin:26px 0 30px; flex-wrap:wrap; border-top:1px solid rgba(198,161,91,0.25); border-bottom:1px solid rgba(198,161,91,0.25);}
.stat-item{flex:1 1 110px; padding:16px 14px; border-right:1px solid rgba(198,161,91,0.2);}
.stat-item:last-child{border-right:none;}
.stat-num{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--gold-light); line-height:1.1;}
.stat-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:rgba(246,240,227,0.6); margin-top:4px;}

/* category grid (home) */
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:10px 0 8px;}
@media (max-width:600px){.cat-grid{grid-template-columns:1fr;}}
.cat-card{background:rgba(255,255,255,0.05); border:1px solid rgba(198,161,91,0.22); border-radius:var(--radius-md); padding:18px 19px; cursor:pointer; transition:transform .15s, border-color .15s, background .15s; text-align:left;}
.cat-card:hover{transform:translateY(-2px); border-color:var(--gold); background:rgba(198,161,91,0.1);}
.cat-card.soon{opacity:.4; cursor:default;}
.cat-card.soon:hover{transform:none; border-color:rgba(198,161,91,0.22); background:rgba(255,255,255,0.05);}
.cat-card .cc-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cat-card .cc-icon{font-size:24px;}
.cat-card .cc-tag{font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:3px 9px; border-radius:8px; background:rgba(79,156,109,0.18); color:#8fd6a5;}
.cat-card.soon .cc-tag{background:rgba(246,240,227,0.1); color:rgba(246,240,227,0.55);}
.cat-card h4{margin:0 0 4px; font-size:15.5px; font-weight:700; color:var(--cream); font-family:'Fraunces',serif;}
.cat-card p{margin:0; font-size:12.5px; color:rgba(246,240,227,0.55); max-width:none;}

/* ---------- MEDIA BLOCKS ---------- */
.media-block{margin:22px 0 26px; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--line); background:var(--paper); box-shadow:var(--shadow-card);}
.book.dark .media-block{background:rgba(255,255,255,0.04); border-color:rgba(198,161,91,0.2);}
.media-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--espresso); padding:12px 16px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:7px;}
.book.dark .media-label{color:var(--gold-light); border-color:rgba(198,161,91,0.15);}
.media-block video{width:100%; display:block; background:#000;}
.media-block img{width:100%; display:block;}
.media-body{padding:14px 16px 16px;}
.media-note{font-size:12.5px; color:var(--muted); padding:0 16px 14px; margin:0;}
audio.custom-audio{width:100%; display:block;}
.speed-controls{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px;}
.speed-label{font-size:12px; color:var(--muted); margin-right:2px;}
.speed-btn{background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
.speed-btn:hover{background:var(--line-soft);}
.speed-btn.active{background:var(--espresso); border-color:var(--espresso); color:#fff;}

/* infocard */
.infocard-note{padding:12px 16px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line-soft); margin:0;}

/* ---------- QUIZ ---------- */
.quiz-box{margin:28px 0 8px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--paper); padding:20px 22px; box-shadow:var(--shadow-card);}
.book.dark .quiz-box{background:rgba(255,255,255,0.05); border-color:rgba(198,161,91,0.2);}
.quiz-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.quiz-question{font-size:15.5px; font-weight:700; color:var(--navy); margin-bottom:14px;}
.book.dark .quiz-question{color:var(--cream);}
.quiz-option{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--paper-warm); border:1.5px solid var(--line); border-radius:11px; padding:11px 14px; margin-bottom:9px; cursor:pointer; font-family:inherit; font-size:14.5px; color:var(--ink); transition:border-color .15s, background .15s;}
.book.dark .quiz-option{background:rgba(255,255,255,0.04); color:var(--cream); border-color:rgba(198,161,91,0.25);}
.quiz-option:hover{border-color:var(--gold);}
.quiz-option .opt-letter{flex:0 0 auto; width:24px; height:24px; border-radius:50%; background:var(--line-soft); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--muted);}
.quiz-option.correct{border-color:var(--success); background:var(--success-bg);}
.quiz-option.correct .opt-letter{background:var(--success); color:#fff;}
.quiz-option.wrong{border-color:var(--danger); background:var(--danger-bg);}
.quiz-option.wrong .opt-letter{background:var(--danger); color:#fff;}
.quiz-option.disabled{cursor:default;}
.quiz-explain{margin-top:12px; padding:13px 15px; background:#EEF1F8; border-radius:10px; font-size:13.5px; color:#3B4A78; display:none;}
.quiz-explain.show{display:block;}

/* ---------- FAQ ---------- */
.faq-item{border-bottom:1px solid var(--line); }
.faq-item:first-child{border-top:1px solid var(--line);}
.faq-question{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 2px; cursor:pointer; font-weight:600; font-size:15px; color:var(--navy);}
.book.dark .faq-question{color:var(--cream);}
.faq-question .faq-plus{flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--gold); color:var(--espresso); display:flex; align-items:center; justify-content:center; font-size:14px; transition:transform .2s;}
.book.dark .faq-question .faq-plus{color:var(--gold-light);}
.faq-item.open .faq-plus{transform:rotate(45deg);}
.faq-answer{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.faq-answer-inner{padding:0 2px 16px; font-size:14.5px; color:var(--muted);}
.book.dark .faq-answer-inner{color:rgba(246,240,227,0.75);}

/* ---------- COVER / HOME ---------- */
.cover-page{display:flex; flex-direction:column; justify-content:flex-start; min-height:64vh; position:relative;}
.deco-line{position:absolute; border:1px solid rgba(198,161,91,0.18); border-radius:50%;}
.cover-eyebrow{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
.cover-eyebrow .cb-dot{width:7px; height:7px; border-radius:50%; background:var(--gold);}
.cover-eyebrow span{font-size:12px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold-light); font-weight:700;}
h1.cover-title{font-size:44px; font-weight:600; line-height:1.06; color:var(--cream); margin:0 0 6px; text-wrap:balance;}
h1.cover-title em{font-style:italic; color:var(--gold-light); font-weight:500;}
.cover-model{font-size:13px; color:rgba(246,240,227,0.55); letter-spacing:.03em; margin-bottom:22px; font-variant-numeric:tabular-nums;}
.cover-lead{font-size:16.5px; line-height:1.65; color:rgba(246,240,227,0.88); max-width:58ch; margin-bottom:6px;}
.btn-gold{align-self:flex-start; margin-top:8px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); color:var(--navy-deep); border:none; padding:14px 28px; border-radius:12px; font-family:inherit; font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:.02em; transition:transform .15s, box-shadow .15s;}
.btn-gold:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(198,161,91,0.35);}

{id:"cafeteira_p_resumo", kind:"chapter", categoryId:"cafeteira", navTitle:"Resumo & Visão Geral", icon:"☕", title:"Resumo & Visão Geral", kicker:"Cafeteira · Capítulo 1 de 10 · Visão Geral", html:"<p>A <strong>Cafeteira Invita Barista Pro Blend</strong> entrega uma experiência completa para quem gosta de café de verdade. É uma solução <strong>portátil (freestanding)</strong>, com <strong>moedor de grãos integrado</strong>, que permite ao usuário escolher o nível ideal de moagem para cada grão. Além do tradicional café espresso, conta com <strong>espumador de leite</strong>, possibilitando o preparo de cappuccinos, mocha, lattes e outras bebidas.</p><p>A linha é composta por dois códigos, que diferem apenas na tensão de alimentação — o restante das características técnicas é idêntico:</p><table class='spec-table'><tr><th>Código</th><th>Tensão</th><th>Uso recomendado</th></tr><tr><td>i-CF-FS-15B-XX-1LBA</td><td>127 V</td><td>Residências com rede 127V</td></tr><tr><td>i-CF-FS-15B-XX-2LBA</td><td>220 V</td><td>Residências com rede 220V</td></tr></table>"},

{id:"cafeteira_p_diferenciais", kind:"chapter", categoryId:"cafeteira", navTitle:"Diferenciais", icon:"✨", title:"Diferenciais Comerciais", kicker:"Cafeteira · Capítulo 2 de 10 · Diferenciais", html:"<p>Cinco diferenciais sustentam o discurso de venda deste produto. Domine-os — são a base de qualquer objeção que um cliente possa levantar.</p><div class='feature-grid'><div class='feature-card'><span class='f-icon'>⚙️</span><h4>Moedor de Grãos Integrado</h4><p>Dispensa a necessidade de um moedor à parte, e permite escolher a intensidade da moagem — grãos sempre frescos, na hora.</p></div><div class='feature-card'><span class='f-icon'>💧</span><h4>Pré-Infusor de Água</h4><p>Realiza a pré-infusão de água no pó de café antes de aplicar a pressão de infusão, entregando uma extração mais uniforme.</p></div><div class='feature-card'><span class='f-icon'>🥛</span><h4>Espumador de Leite</h4><p>Bico de vapor dedicado para criar espuma densa e aveludada — essencial para lattes e cappuccinos.</p></div><div class='feature-card'><span class='f-icon'>📊</span><h4>Bomba Italiana · 15 Bar</h4><p>Sistema térmico inovador que aquece a água de forma uniforme, extraindo sabor e cremosidade do café.</p></div><div class='feature-card'><span class='f-icon'>🔥</span><h4>Thermoblock</h4><p>Mantém a temperatura da água aquecida enquanto ligada, dispensando reaquecimento a cada uso.</p></div><div class='feature-card'><span class='f-icon'>🧠</span><h4>Café de Memória</h4><p>Permite programar e memorizar o volume exato de café desejado para as xícaras favoritas do cliente.</p></div></div><h2 class='section-title'>🎬 Vídeo · Diferenciais</h2><div class='media-block'><div class='media-label'>▶️ Vídeo · Tutorial Completo Cafeteira Invita</div><video controls preload='metadata'><source src='media/cafeteira/tutorial.mp4' type='video/mp4'></video></div><p style='margin-top:8px;'>Assista ao vídeo antes de prosseguir — ele mostra visualmente a montagem da caixa de grãos, o preparo do espresso e a espuma de leite, processos que serão detalhados por escrito nos próximos capítulos.</p><h2 class='section-title'>🎧 Áudio · Diferenciais</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Diferenciais Cafeteira Invita</div><div class='media-body'><audio class='custom-audio' id='cafAud1' controls preload='none' src='media/cafeteira/audio-diferenciais.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='cafAud1' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='cafAud1' data-rate='1'>1x</button><button class='speed-btn' data-target='cafAud1' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='cafAud1' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='cafAud1' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Guia Mestre dos Diferenciais</div><img src='media/cafeteira/infocard-diferenciais.jpg' alt='Infográfico com os 8 diferenciais da Cafeteira Invita Barista Pro Blend' loading='lazy'><p class='infocard-note'>Use este infográfico como apoio visual em conversas com o cliente ou em posts de divulgação.</p></div>", quiz:{"question":"Qual componente é responsável por deixar a água pré-molhando o pó de café antes da extração sob pressão total?","options":["Thermoblock","Pré-infusor de água","Bomba Italiana","Barômetro"],"correct":1,"explain":"O pré-infusor de água umedece o pó de café antes da pressão de infusão total, resultando em uma extração mais uniforme e um espresso de melhor qualidade."}},

{id:"cafeteira_p_specs", kind:"chapter", categoryId:"cafeteira", navTitle:"Especificações Técnicas", icon:"📐", title:"Especificações Técnicas", kicker:"Cafeteira · Capítulo 3 de 10 · Ficha Técnica", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Característica</th><th>i-CF-FS-15B-XX-1LBA</th><th>i-CF-FS-15B-XX-2LBA</th></tr><tr><td>Instalação</td><td colspan='2'>Portátil (Freestanding)</td></tr><tr><td>Dimensões do produto (L×A×P)</td><td colspan='2'>320 × 418 × 396 mm</td></tr><tr><td>Dimensões da embalagem (L×A×P)</td><td colspan='2'>415 × 415 × 450 mm</td></tr><tr><td>Peso líquido</td><td colspan='2'>7,6 kg</td></tr><tr><td>Peso bruto</td><td colspan='2'>9,2 kg</td></tr><tr><td>Acabamento</td><td colspan='2'>Aço Inox</td></tr><tr><td>Filtro</td><td colspan='2'>1 xícara (7g) / 2 xícaras (14g)</td></tr><tr><td>Capacidade do moedor</td><td colspan='2'>120 g</td></tr><tr><td>Pressão de trabalho</td><td colspan='2'>15 bar</td></tr><tr><td>Reservatório de água</td><td colspan='2'>2 litros</td></tr><tr><td>Barômetro</td><td colspan='2'>Sim</td></tr><tr><td>Bomba</td><td colspan='2'>Italiana (Ulka)</td></tr><tr><td>Potência elétrica</td><td colspan='2'>1.350 W</td></tr><tr><td>Tensão</td><td>127 V</td><td>220 V</td></tr><tr><td>Corrente</td><td colspan='2'>6,1 A</td></tr><tr><td>Frequência</td><td colspan='2'>60 Hz</td></tr><tr><td>NCM</td><td colspan='2'>8516.71.00</td></tr></table></div><div class='callout info'><span class='c-icon'>ℹ️</span><p>Informações técnicas podem sofrer alterações sem aviso prévio. Em caso de dúvida, consulte a versão online do Manual do Consumidor em invitacasa.com.br.</p></div>", quiz:{"question":"Qual a capacidade do reservatório de água da Cafeteira Invita?","options":["1 litro","1,5 litro","2 litros","3 litros"],"correct":2,"explain":"O reservatório comporta 2 litros de água, suficiente para múltiplas extrações sem a necessidade de reabastecimento constante."}},

{id:"cafeteira_p_instalacao", kind:"chapter", categoryId:"cafeteira", navTitle:"Instalação e Segurança", icon:"🔌", title:"Instalação e Segurança", kicker:"Cafeteira · Capítulo 4 de 10 · Instalação", html:"<p>Durante a instalação, mantenha o produto <strong>desligado da alimentação elétrica</strong>. Nunca deixe a embalagem (isopor, plásticos) ao alcance de crianças.</p><h2 class='section-title'>⚡ Requisitos Elétricos</h2><ul class='styled'><li>Verifique se a tensão indicada na etiqueta do produto é compatível com a rede elétrica antes de conectar.</li><li>Utilize uma <strong>tomada dedicada e aterrada</strong>, conforme norma NBR 5410, com fios de bitola mínima de <strong>2,5 mm²</strong>.</li><li>Disjuntor térmico dedicado, com abertura de contato de pelo menos 3 mm, localizado fora do nicho de instalação.</li><li>Nunca utilize adaptadores, T's, benjamins ou extensões elétricas.</li></ul><h2 class='section-title'>📏 Requisitos de Espaço</h2><ul class='styled'><li>Superfície de instalação plana — nunca posicione em superfícies inclinadas.</li><li>Distância mínima livre de <strong>150 mm</strong> em todo o perímetro da cafeteira.</li><li>Longe da incidência direta de sol e de fontes de calor (fogão, forno, aquecedor).</li><li>Evite locais úmidos.</li></ul><div class='callout danger'><span class='c-icon'>⚠️</span><p>A cafeteira <strong>não deve ser colocada em gabinete fechado durante o uso</strong> — é um produto portátil, de bancada, não embutido.</p></div><div class='callout warn'><span class='c-icon'>👷</span><p>Use duas ou mais pessoas para mover e instalar o produto — há risco de lesão por excesso de peso (o conjunto pesa até 9,2 kg embalado).</p></div><h2 class='section-title'>🎧 Áudio · Instalação</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Instalação Cafeteira Invita</div><div class='media-body'><audio class='custom-audio' id='cafAud2' controls preload='none' src='media/cafeteira/audio-instalacao.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='cafAud2' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='cafAud2' data-rate='1'>1x</button><button class='speed-btn' data-target='cafAud2' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='cafAud2' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='cafAud2' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Guia de Instalação e Segurança</div><img src='media/cafeteira/infocard-instalacao.jpg' alt='Infográfico com o passo a passo de instalação e segurança da Cafeteira Invita' loading='lazy'></div>", quiz:{"question":"Qual a distância mínima livre recomendada no perímetro da cafeteira?","options":["50 mm","100 mm","150 mm","300 mm"],"correct":2,"explain":"São necessários 150 mm livres em todo o perímetro para ventilação adequada e manuseio seguro do equipamento."}},

{id:"cafeteira_p_operar1", kind:"chapter", categoryId:"cafeteira", navTitle:"Como Operar — Preparação", icon:"⚙️", title:"Como Operar — Preparação e Moagem", kicker:"Cafeteira · Capítulo 5 de 10 · Primeiro Uso", html:"<h2 class='section-title'>🧼 Primeiro Uso</h2><p>Antes de usar pela primeira vez, limpe o interior do produto e todos os acessórios internos com água morna e sabão neutro, para eliminar o típico odor de produto novo. Seque totalmente antes de operar.</p><h2 class='section-title'>🎛️ Painel de Controle</h2><table class='spec-table'><tr><th>Tecla</th><th>Função</th></tr><tr><td>A</td><td>Vapor / Água quente</td></tr><tr><td>B</td><td>Xícaras de café \"2\"</td></tr><tr><td>C</td><td>Xícara de café \"1\"</td></tr><tr><td>D</td><td>Medidor de pressão (barômetro)</td></tr><tr><td>E</td><td>Tamanho do filtro (1 ou 2 copos)</td></tr><tr><td>F</td><td>Quantidade de moagem</td></tr><tr><td>G</td><td>Ligar / Desligar</td></tr></table><h2 class='section-title'>☕ Instalando a Caixa de Grãos</h2><ol class='styled'><li>Gire o botão de ajuste \"Grind\" no sentido anti-horário até o final.</li><li>Retire a tampa da caixa de grãos e confirme que o botão elástico da caixa está desbloqueado.</li><li>Verifique se o anel de vedação está instalado corretamente na base.</li><li>Coloque a caixa de grãos na posição e gire o botão elástico no sentido horário para travar.</li><li>Encha com grãos de café e feche a tampa.</li></ol><div class='callout info'><span class='c-icon'>🔔</span><p>Se a caixa travar corretamente, a lâmpada indicadora fica branca e a máquina emite um bipe. Três bipes de aviso indicam instalação incorreta.</p></div><h2 class='section-title'>⚙️ Moagem de Grãos</h2><ol class='styled'><li>Gire o botão de quantidade de moagem para alinhar com o ícone de xícara desejado (1 ou 2).</li><li>Selecione o tamanho de filtro correspondente na tecla \"E\".</li><li>Insira o funil no suporte e empurre-o contra o interruptor de moagem — a máquina começa a moer.</li><li>Gire o botão de ajuste de moagem para a espessura desejada durante a moagem.</li><li>Pressione novamente o interruptor para interromper, ou aguarde a quantidade padrão de fábrica.</li></ol><div class='callout warn'><span class='c-icon'>💡</span><p>O tipo de grão e a espessura da moagem afetam diretamente a extração: pó muito grosso não extrai bem; pó muito fino pode entupir o filtro.</p></div>"},

{id:"cafeteira_p_operar2", kind:"chapter", categoryId:"cafeteira", navTitle:"Como Operar — Café e Vapor", icon:"🥛", title:"Como Operar — Café, Vapor e Água Quente", kicker:"Cafeteira · Capítulo 6 de 10 · Preparo das Bebidas", html:"<h2 class='section-title'>☕ Preparo de Café Espresso</h2><ol class='styled'><li>Retire o funil do suporte e use o pilão para prensar bem o pó de café; limpe o excesso na borda.</li><li>Insira o funil na saída de café e trave-o firmemente; posicione a xícara sob o bico.</li><li>Pressione rapidamente o botão de vapor/água duas vezes para acionar a bomba.</li><li>Quando os indicadores de pré-aquecimento estiverem acesos, pressione \"1 xícara\" ou \"2 xícaras\".</li><li>Aguarde a extração parar automaticamente ao atingir a quantidade definida.</li></ol><h2 class='section-title'>🥛 Espuma de Leite a Vapor</h2><ol class='styled'><li>Pressione ligar e, em seguida, o botão de vapor por 2 segundos — a máquina emite dois bipes e pré-aquece.</li><li>Aguarde a luz indicadora ficar branca e parar de piscar (pré-aquecimento concluído).</li><li>Despeje leite integral gelado (4–8°C) em 1/3 da xícara de latte art.</li><li>Mergulhe o bocal de vapor 1 cm no leite e gire o botão de vapor lentamente.</li><li>Quando o leite atingir cerca de 75°C e a espuma inflar, desligue o vapor.</li></ol><div class='callout warn'><span class='c-icon'>🥛</span><p>Use sempre <strong>leite integral</strong> — é o que melhor forma espuma densa e estável. O tempo máximo de formação de espuma é de 2 minutos por vez.</p></div><h2 class='section-title'>💧 Função Água Quente</h2><p><strong>Método 1:</strong> com a máquina pré-aquecida, pressione o botão de água quente — a bomba funciona e para automaticamente. <strong>Método 2:</strong> em modo de espera, gire o botão de vapor para a posição de água quente contínua.</p><h2 class='section-title'>🧠 Café de Memória</h2><p>Após o pré-aquecimento, pressione e segure a tecla de café (entre 10s e 60s) enquanto o café sai. Solte quando atingir o volume desejado — um sinal sonoro confirma que a nova quantidade foi memorizada para os próximos preparos.</p><div class='callout danger'><span class='c-icon'>💧</span><p><strong>Falta de água:</strong> se o reservatório esvaziar, os indicadores ficam vermelhos e soam três bipes. Reabasteça e execute a função água quente ou vapor para reiniciar o bombeamento.</p></div>"},

{id:"cafeteira_p_manutencao", kind:"chapter", categoryId:"cafeteira", navTitle:"Manutenção e Limpeza", icon:"🧽", title:"Manutenção, Limpeza e Descalcificação", kicker:"Cafeteira · Capítulo 7 de 10 · Manutenção", html:"<div class='callout danger'><span class='c-icon'>⚡</span><p>Antes de qualquer limpeza, <strong>desligue o produto e remova o plugue da tomada</strong>. Nunca imerja o produto em água nem use limpadores a vapor.</p></div><h2 class='section-title'>🧼 Limpeza de Rotina</h2><ul class='styled'><li>Não utilize produtos ou esponjas abrasivas.</li><li>Limpe o produto e acessórios internos com pano limpo e água morna; enxugue com pano macio.</li><li>Destrave o funil e remova o café moído residual após cada uso.</li><li>Após vaporizar leite, libere água quente pelo tubo de vapor para evitar entupimento do bocal.</li><li>O produto deve estar completamente seco antes de voltar a operar.</li></ul><h2 class='section-title'>🧪 Função de Descalcificação</h2><p>Após 300 ciclos somados de café + vapor + água quente, o indicador de descalcificação acende em vermelho, lembrando o usuário de realizar a limpeza do sistema interno.</p><ol class='styled'><li>Coloque cerca de <strong>10 g de agente descalcificante</strong> no reservatório e encha com água até o nível máximo.</li><li>Entre em modo de espera e segure o botão de quantidade de moagem por 10 segundos.</li><li>Gire o botão de vapor para a posição indicada e pressione ligar/desligar para iniciar a descalcificação (1ª etapa, ~23 minutos).</li><li>Descarte a água usada, encha o reservatório com água limpa e execute a 2ª etapa (~3 minutos) para enxágue.</li><li>Ao final, os indicadores se apagam e o produto desliga — a descalcificação está concluída.</li></ol><div class='callout warn'><span class='c-icon'>⏱️</span><p>Se o indicador de descalcificação acender mas o procedimento não for feito, o uso não é prejudicado, mas a luz permanece acesa. É possível apagá-la manualmente segurando as teclas indicadas por 2 segundos.</p></div><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza Cafeteira Invita</div><div class='media-body'><audio class='custom-audio' id='cafAud3' controls preload='none' src='media/cafeteira/audio-manutencao.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='cafAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='cafAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='cafAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='cafAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='cafAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção e Limpeza</div><img src='media/cafeteira/infocard-manutencao.jpg' alt='Infográfico com o guia prático de manutenção e limpeza da Cafeteira Invita' loading='lazy'></div>", quiz:{"question":"Após quantos ciclos combinados de café, vapor e água quente a Cafeteira Invita avisa que é hora de descalcificar?","options":["100","200","300","500"],"correct":2,"explain":"Após 300 ciclos somados de café + vapor + água quente, o indicador de descalcificação acende em vermelho, lembrando o usuário de realizar a limpeza do sistema interno."}},

{id:"cafeteira_p_problemas", kind:"chapter", categoryId:"cafeteira", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Cafeteira · Capítulo 8 de 10 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Sem água/vapor ao fazer café</td><td>Reservatório vazio ou máquina não pré-aquecida</td><td>Encha o reservatório e aguarde o pré-aquecimento concluir</td></tr><tr><td>Sem vapor</td><td>Furo de saída bloqueado ou vapor não ligado antes do pré-aquecimento</td><td>Desbloqueie os furos e aguarde o pré-aquecimento</td></tr><tr><td>Mais ou menos café que o esperado</td><td>Quantidade de pó incorreta (padrão: 7g por xícara)</td><td>Ajuste a quantidade e a espessura do pó</td></tr><tr><td>Leite não espuma bem</td><td>Leite não é integral, ou pré-aquecimento incompleto</td><td>Use leite integral gelado e aguarde luz constante</td></tr><tr><td>Sem moagem</td><td>Caixa de grãos fora de posição</td><td>Gire a caixa e o botão para a posição correta</td></tr><tr><td>Grão transborda ao retirar a caixa</td><td>Anel de vedação mal instalado</td><td>Reinstale o anel de vedação corretamente</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>Se o problema persistir após as verificações, oriente o cliente a contatar a assistência técnica autorizada Invita: <strong>0800 723 1202</strong> ou <strong>sac@invitacasa.com.br</strong>.</p></div>"},

{id:"cafeteira_p_glossario", kind:"chapter", categoryId:"cafeteira", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Cafeteira · Capítulo 9 de 10 · Termos Essenciais", html:"<ul class='styled'><li><strong>Bar:</strong> unidade de pressão. A Cafeteira Invita opera a 15 bar, padrão para extração de espresso de qualidade.</li><li><strong>Thermoblock:</strong> sistema que mantém a água aquecida constantemente enquanto a máquina está ligada.</li><li><strong>Pré-infusão:</strong> etapa em que a água umedece o pó de café antes da pressão total ser aplicada.</li><li><strong>Bomba Italiana (Ulka):</strong> bomba de pressão de origem/tecnologia italiana, referência em cafeteiras espresso.</li><li><strong>Barômetro:</strong> medidor de pressão visível no painel, indica a pressão de extração em tempo real.</li><li><strong>Freestanding (Portátil):</strong> categoria de instalação — produto de bancada, não embutido em móvel.</li><li><strong>NBR 5410:</strong> norma brasileira de instalações elétricas de baixa tensão, referência para aterramento.</li><li><strong>Descalcificação:</strong> processo de remoção de resíduos de cálcio acumulados internamente pelo uso da água.</li><li><strong>Funil (Portafiltro):</strong> peça onde o pó de café é prensado e encaixada na saída de extração.</li></ul>"},

{id:"cafeteira_p_faq", kind:"chapter", categoryId:"cafeteira", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Cafeteira · Capítulo 10 de 10 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>A cafeteira pode ser embutida em um móvel?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. É um produto portátil (freestanding), de bancada. Não deve ser colocada em gabinete fechado durante o uso — precisa de 150 mm livres ao redor para ventilação.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual a diferença entre os dois códigos do produto?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Apenas a tensão: i-CF-FS-15B-XX-1LBA é 127V e i-CF-FS-15B-XX-2LBA é 220V. Todas as demais especificações são idênticas.</div></div></div><div class='faq-item'><div class='faq-question'><span>Que tipo de leite dá a melhor espuma?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Leite integral, gelado (4–8°C), rende a espuma mais densa e estável para lattes e cappuccinos.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quanto pó de café usar por xícara?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O padrão de fábrica é cerca de 7g para 1 xícara e 14g para 2 xícaras, usando a colher medidora que acompanha o produto.</div></div></div><div class='faq-item'><div class='faq-question'><span>É possível usar cápsulas de café?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. O sistema é próprio para café moído prensado no funil, com moedor de grãos integrado — não é compatível com cápsulas.</div></div></div><div class='faq-item'><div class='faq-question'><span>Com que frequência é preciso descalcificar?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>A máquina avisa automaticamente após 300 ciclos somados de café, vapor e água quente, acendendo o indicador de descalcificação.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso mover a cafeteira enquanto ela está ligada?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. Nunca movimente o produto em operação. Aguarde esfriar antes de deslocar ou limpar qualquer peça.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso usar extensão elétrica ou adaptador?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. É expressamente proibido o uso de adaptadores, T's, benjamins ou extensões — utilize sempre tomada dedicada e aterrada.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quanto tempo leva o pré-aquecimento?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O manual não define um tempo fixo — o pré-aquecimento é concluído quando as luzes indicadoras param de piscar e ficam acesas de forma constante, com um bipe de confirmação.</div></div></div><div class='faq-item'><div class='faq-question'><span>O que fazer se aparecer three bipes ao montar a caixa de grãos?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Três bipes indicam que a caixa de grãos não está corretamente montada, ou o botão de seleção está na posição errada. Reposicione e trave novamente.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia deste produto?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses contra defeitos de fabricação. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div><div class='faq-item'><div class='faq-question'><span>O funil pode ser removido durante a extração?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Nunca. O funil não deve ser removido durante a operação de infusão — a máquina está sob pressão e há risco de acidente.</div></div></div>"},

{id:"churrasqueira_cover", kind:"cover", categoryId:"churrasqueira", coverIcon:"🔥", coverEyebrow:"Categoria · Linha Quente", coverTitle:"Churrasqueira Invita<br><em>Gás 55cm</em>", coverModel:"i-BBQ-2Q-55-XX-NHUA &middot; GLP (conversão para GN sob consulta)", coverLead:"Guia completo sobre a Churrasqueira Invita a Gás 55cm: diferenciais, ficha técnica, instalação segura da rede de gás, operação e manutenção.", stats:[{"n":"24k","l":"BTU/h total"},{"n":"2","l":"Queimadores"},{"n":"55cm","l":"Largura"},{"n":"304","l":"Aço Inox"}]},

{id:"churrasqueira_p_resumo", kind:"chapter", categoryId:"churrasqueira", navTitle:"Resumo & Visão Geral", icon:"🔥", title:"Resumo & Visão Geral", kicker:"Churrasqueira · Capítulo 1 de 9 · Visão Geral", html:"<p>A <strong>Churrasqueira Invita a Gás 55cm</strong> traz praticidade e design para a área gourmet. É uma solução <strong>totalmente embutida</strong>, com 55 cm de largura, permitindo instalação em bancadas de diversos tamanhos. Conta com <strong>dois queimadores potentes</strong>, ideal para o preparo de carnes, peixes e vegetais.</p><table class='spec-table'><tr><th>Código</th><th>Instalação</th><th>Gás padrão</th></tr><tr><td>i-BBQ-2Q-55-XX-NHUA</td><td>Embutir (bancada)</td><td>GLP — conversão para GN mediante contato com o SAC Invita</td></tr></table><div class='callout danger'><span class='c-icon'>🌬️</span><p>Este produto é para <strong>uso exclusivo em ambientes externos e ventilados</strong>. Nunca deve ser instalado em ambientes internos e fechados.</p></div>"},

{id:"churrasqueira_p_diferenciais", kind:"chapter", categoryId:"churrasqueira", navTitle:"Diferenciais", icon:"✨", title:"Diferenciais Comerciais", kicker:"Churrasqueira · Capítulo 2 de 9 · Diferenciais", html:"<p>Oito diferenciais sustentam o discurso de venda deste produto — domine-os para responder qualquer objeção comercial.</p><div class='feature-grid'><div class='feature-card'><span class='f-icon'>📏</span><h4>Largura Versátil (55cm)</h4><p>Design compacto que permite instalação em diversos tamanhos de bancadas gourmet.</p></div><div class='feature-card'><span class='f-icon'>🔥</span><h4>Potência em Dobro</h4><p>Dois queimadores tipo flauta com 12.000 BTU cada, totalizando 24.000 BTU/h.</p></div><div class='feature-card'><span class='f-icon'>⚡</span><h4>Acendimento Piezoelétrico</h4><p>Ativação automática e segura, sem necessidade de conexão com a rede elétrica.</p></div><div class='feature-card'><span class='f-icon'>🛡️</span><h4>Aço Inox 304</h4><p>Acabamento premium que garante máxima durabilidade e resistência à corrosão.</p></div><div class='feature-card'><span class='f-icon'>🧩</span><h4>Instalação de Embutir</h4><p>Integração perfeita à bancada, conferindo um visual limpo e elegante ao ambiente gourmet.</p></div><div class='feature-card'><span class='f-icon'>🧽</span><h4>Bandeja Coletora</h4><p>Bandeja de gordura removível que facilita muito a higienização após o uso.</p></div><div class='feature-card'><span class='f-icon'>🌡️</span><h4>Medidor de Temperatura</h4><p>Termômetro integrado na tampa para controle preciso do ponto do churrasco.</p></div><div class='feature-card'><span class='f-icon'>🔩</span><h4>Grade Robusta (8mm)</h4><p>Grade em aço inoxidável de 8mm que retém e distribui melhor o calor de cocção.</p></div></div><h2 class='section-title'>🎬 Vídeo · Diferenciais</h2><div class='media-block'><div class='media-label'>▶️ Vídeo · Diferenciais Churrasqueira Invita</div><video controls preload='metadata'><source src='media/churrasqueira/video-diferenciais.mp4' type='video/mp4'></video></div><p style='margin-top:8px;'>O vídeo apresenta visualmente os dois queimadores, o acendimento piezoelétrico e o acabamento em aço inox 304 — reforce estes pontos na conversa comercial.</p><h2 class='section-title'>🎧 Áudio · Diferenciais</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Diferenciais Churrasqueira Invita</div><div class='media-body'><audio class='custom-audio' id='bbqAud1' controls preload='none' src='media/churrasqueira/audio-diferenciais.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='bbqAud1' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='bbqAud1' data-rate='1'>1x</button><button class='speed-btn' data-target='bbqAud1' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='bbqAud1' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='bbqAud1' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Guia Premium dos Diferenciais</div><img src='media/churrasqueira/infocard-diferenciais.jpg' alt='Infográfico com os 8 diferenciais da Churrasqueira Invita a Gás 55cm' loading='lazy'></div>", quiz:{"question":"Qual a potência total dos dois queimadores da Churrasqueira Invita?","options":["12.000 BTU/h","18.000 BTU/h","24.000 BTU/h","30.000 BTU/h"],"correct":2,"explain":"Cada queimador entrega 12.000 BTU/h (3,5 kW); somados, os dois queimadores totalizam 24.000 BTU/h (7 kW)."}},

{id:"churrasqueira_p_specs", kind:"chapter", categoryId:"churrasqueira", navTitle:"Especificações Técnicas", icon:"📐", title:"Especificações Técnicas", kicker:"Churrasqueira · Capítulo 3 de 9 · Ficha Técnica", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Característica</th><th>i-BBQ-2Q-55-XX-NHUA</th></tr><tr><td>Instalação</td><td>Embutir (bancada)</td></tr><tr><td>Dimensões do produto (L×A×P)</td><td>615 × 290 × 540 mm</td></tr><tr><td>Peso líquido</td><td>18,5 kg</td></tr><tr><td>Acabamento</td><td>Aço Inox 304</td></tr><tr><td>Grade</td><td>Aço inoxidável, 8 mm</td></tr><tr><td>Quantidade de queimadores</td><td>2 (tipo flauta)</td></tr><tr><td>Potência por queimador</td><td>3,5 kW / 12.000 BTU/h</td></tr><tr><td>Potência total</td><td>7 kW / 24.000 BTU/h</td></tr><tr><td>Tipo de gás</td><td>GLP (padrão) — GN mediante conversão</td></tr><tr><td>Pressão do gás GLP / GN</td><td>2,75 kPa / 1,96 kPa</td></tr><tr><td>Acendimento</td><td>Piezoelétrico</td></tr><tr><td>Medidor de temperatura</td><td>Sim (na tampa)</td></tr><tr><td>Bandeja coletora de gordura</td><td>Sim, removível</td></tr><tr><td>NCM</td><td>7321.11.00</td></tr></table></div><div class='callout info'><span class='c-icon'>ℹ️</span><p>Informações técnicas podem sofrer alterações sem aviso prévio. Em caso de dúvida, consulte a versão online do Manual do Consumidor em invitacasa.com.br.</p></div>", quiz:{"question":"Qual o tipo de gás padrão de fábrica desta churrasqueira?","options":["Gás Natural (GN)","GLP (botijão)","Ambos, sem necessidade de ajuste","Não utiliza gás"],"correct":1,"explain":"O padrão de fábrica é GLP. A conversão para Gás Natural (GN) exige contato com o SAC Invita, pois muda o bico injetor e a pressão de trabalho (2,75 kPa para 1,96 kPa)."}},

{id:"churrasqueira_p_instalacao", kind:"chapter", categoryId:"churrasqueira", navTitle:"Instalação e Segurança", icon:"🧯", title:"Instalação e Segurança", kicker:"Churrasqueira · Capítulo 4 de 9 · Instalação", html:"<div class='callout danger'><span class='c-icon'>⚠️</span><p>A instalação da rede de gás <strong>deve ser feita por um técnico qualificado</strong>. Recomenda-se que instalação, ajustes e manutenções sejam executados por um posto de serviço autorizado Invita.</p></div><h2 class='section-title'>📍 Local e Ventilação</h2><ul class='styled'><li>Uso <strong>exclusivo em ambientes externos</strong>, permanentemente ventilados e protegidos de correntes de ar.</li><li>Distância mínima de <strong>50 cm</strong> de qualquer móvel ou equipamento nas proximidades.</li><li>Distância vertical mínima de <strong>100 cm</strong> acima da zona de cocção até materiais combustíveis.</li></ul><h2 class='section-title'>🧱 Materiais do Nicho</h2><ul class='styled'><li>Utilize <strong>alvenaria com materiais refratários</strong> — nunca madeira ou outro material combustível.</li><li>Distância mínima de <strong>30 cm</strong> de paredes de alvenaria/pedra; <strong>50 cm</strong> de armários de madeira.</li></ul><h2 class='section-title'>🔗 Conexão de Gás</h2><ul class='styled'><li>Conexão via tubo metálico flexível com porca 3/8\" cônica, na parte traseira direita.</li><li>Use apenas <strong>mangueiras e reguladores certificados pelo INMETRO</strong> — verifique a validade regularmente.</li><li>Após instalar, teste vazamentos com <strong>espuma de sabão</strong> em todas as conexões manuseadas — bolhas indicam vazamento.</li></ul><div class='callout warn'><span class='c-icon'>🔥</span><p><strong>Cheiro de gás?</strong> Feche o registro, ventile o ambiente, não acenda chamas ou aparelhos elétricos, teste as conexões com espuma de sabão. Persistindo a dúvida, contate a companhia de gás ou o SAC Invita.</p></div><h2 class='section-title'>🎧 Áudio · Instalação</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Instalação Churrasqueira Invita</div><div class='media-body'><audio class='custom-audio' id='bbqAud2' controls preload='none' src='media/churrasqueira/audio-instalacao.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='bbqAud2' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='bbqAud2' data-rate='1'>1x</button><button class='speed-btn' data-target='bbqAud2' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='bbqAud2' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='bbqAud2' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Guia de Segurança e Instalação</div><img src='media/churrasqueira/infocard-instalacao.jpg' alt='Infográfico com o passo a passo de instalação e segurança da Churrasqueira Invita' loading='lazy'></div>", quiz:{"question":"Qual a distância mínima recomendada da churrasqueira até armários de madeira?","options":["10 cm","30 cm","50 cm","100 cm"],"correct":2,"explain":"São necessários ao menos 50 cm de distância de armários de madeira (30 cm para paredes de alvenaria/pedra), para evitar aquecimento de materiais combustíveis."}},

{id:"churrasqueira_p_operar", kind:"chapter", categoryId:"churrasqueira", navTitle:"Como Operar", icon:"🎛️", title:"Como Operar", kicker:"Churrasqueira · Capítulo 5 de 9 · Acendimento e Ajuste", html:"<h2 class='section-title'>🔥 Queima Inicial (Primeiro Uso)</h2><p>Antes de usar pela primeira vez, verifique se todas as mangueiras e conexões de gás estão apertadas. Acenda todos os queimadores no <strong>nível máximo por 30 minutos</strong>, com a tampa aberta. Depois, aguarde a grelha esfriar e lave-a com água e detergente neutro.</p><h2 class='section-title'>🎛️ Acendimento dos Queimadores</h2><ol class='styled'><li>Empurre levemente o manípulo e gire-o no sentido <strong>anti-horário</strong> para acender.</li><li>Gire lentamente até o ponto de ignição — girar rápido demais pode impedir o acendimento.</li><li>Após a ignição, confirme que a chama está azul clara e uniforme dos dois lados do queimador.</li><li>Para desligar, gire o manípulo no sentido horário até a posição \"OFF\".</li></ol><div class='callout danger'><span class='c-icon'>⚠️</span><p>Os queimadores só podem ser acesos <strong>com a tampa aberta</strong>. Nunca se incline sobre eles. Em falha de ignição, aguarde o gás acumulado se dissipar antes de tentar novamente.</p></div><h2 class='section-title'>🔵 Ajuste da Chama</h2><p>O padrão ideal é uma chama <strong>predominantemente azul escura</strong>, com pontas ocasionais em azul claro/amarelo. Se a chama estiver amarela e lenta, é possível ajustar o registro de ar na base do queimador — este ajuste normalmente já vem correto de fábrica.</p><div class='callout warn'><span class='c-icon'>💡</span><p>Com a tampa fechada, opere no máximo com 50% da capacidade (todos os queimadores em chama baixa, ou apenas um em potência máxima). Desligue o fornecimento de gás no botijão após cada uso.</p></div>"},

{id:"churrasqueira_p_manutencao", kind:"chapter", categoryId:"churrasqueira", navTitle:"Manutenção e Limpeza", icon:"🧽", title:"Manutenção e Limpeza", kicker:"Churrasqueira · Capítulo 6 de 9 · Manutenção", html:"<div class='callout danger'><span class='c-icon'>🧯</span><p>Limpeza e manutenção só devem ser feitas com a churrasqueira <strong>fria</strong> e o fornecimento de gás <strong>fechado</strong> no botijão ou gás encanado.</p></div><h2 class='section-title'>🧼 Limpeza Geral</h2><ul class='styled'><li>Esponja macia, água morna e detergente neutro — acompanhe o sentido do escovado do aço inox.</li><li>Nunca use agentes de limpeza abrasivos nas superfícies externas de aço inoxidável.</li><li>Grelhas: escova de aço + esponja macia; também podem ir à máquina de lavar louça.</li><li>Defletores de chama: água corrente, esponja e detergente — a pirólise já elimina boa parte dos resíduos durante a cocção.</li></ul><h2 class='section-title'>🕳️ Limpeza do Queimador</h2><p>Use um pincel macio e verifique se os furos estão desobstruídos; se necessário, use um arame fino. <strong>Insetos e aranhas</strong> são atraídos pelo cheiro de gás e podem nidificar nas aberturas — chama amarelada, aquecimento irregular ou estalidos são sinais de que a limpeza é necessária.</p><h2 class='section-title'>🛢️ Bandeja de Gotejamento</h2><div class='callout warn'><span class='c-icon'>🔥</span><p>Esvazie regularmente — gordura acumulada pode se incendiar espontaneamente por superaquecimento. <strong>Nunca coloque papel alumínio</strong> na bandeja, isso aumenta o acúmulo de gordura.</p></div><p>Após qualquer limpeza, verifique novamente a conexão da mangueira de gás. Rachaduras ou pontos de fusão exigem substituição da mangueira e um novo teste de estanqueidade.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza Churrasqueira Invita</div><div class='media-body'><audio class='custom-audio' id='bbqAud3' controls preload='none' src='media/churrasqueira/audio-manutencao.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='bbqAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='bbqAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='bbqAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='bbqAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='bbqAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção e Limpeza</div><img src='media/churrasqueira/infocard-manutencao.jpg' alt='Infográfico com o guia prático de manutenção e limpeza da Churrasqueira Invita' loading='lazy'></div>", quiz:{"question":"Por que nunca se deve forrar a bandeja de gotejamento da churrasqueira com papel alumínio?","options":["Porque derrete com o calor","Porque aumenta o acúmulo de gordura e o risco de incêndio","Porque emite fumaça tóxica","Porque impede a limpeza da grelha"],"correct":1,"explain":"O papel alumínio leva a um maior acúmulo de gordura na bandeja, aumentando o risco de incêndio por superaquecimento."}},

{id:"churrasqueira_p_problemas", kind:"chapter", categoryId:"churrasqueira", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Churrasqueira · Capítulo 7 de 9 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Explosões e calor desigual</td><td>Excesso de gordura/cinzas em grelhas e queimadores</td><td>Limpe regularmente conforme especificado</td></tr><tr><td>Potência fraca em chama alta</td><td>Botijão vazio, regulador com defeito ou mangueira comprimida</td><td>Troque o botijão/regulador ou reposicione a mangueira</td></tr><tr><td>Queimador só queima de um lado</td><td>Slot de conexão cruzada entupido</td><td>Limpe o queimador (furos e ranhura)</td></tr><tr><td>Cheiro de gás</td><td>Vazamento em alguma conexão</td><td>Feche o gás imediatamente e teste com espuma de sabão</td></tr><tr><td>Queimador não acende</td><td>Sujeira na ignição piezoelétrica</td><td>Limpe a região da centelha e do espalha-chamas</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>Se o problema persistir após as verificações, oriente o cliente a contatar a assistência técnica autorizada Invita: <strong>0800 723 1202</strong> ou <strong>sac@invitacasa.com.br</strong>.</p></div>"},

{id:"churrasqueira_p_glossario", kind:"chapter", categoryId:"churrasqueira", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Churrasqueira · Capítulo 8 de 9 · Termos Essenciais", html:"<ul class='styled'><li><strong>BTU/h:</strong> unidade de medida de potência térmica (British Thermal Unit por hora).</li><li><strong>GLP:</strong> Gás Liquefeito de Petróleo, fornecido em botijão — gás padrão desta churrasqueira.</li><li><strong>GN:</strong> Gás Natural, fornecido por rede encanada — requer conversão do produto.</li><li><strong>Piezoelétrico:</strong> sistema de ignição por centelha mecânica, sem depender de energia elétrica.</li><li><strong>Defletor de chama:</strong> peça que protege o queimador e ajuda a distribuir o calor na grelha.</li><li><strong>Nicho:</strong> vão no móvel/bancada onde o produto embutido é instalado.</li><li><strong>Regulador de pressão:</strong> dispositivo que controla a pressão do gás vindo do botijão.</li><li><strong>Estanqueidade:</strong> ausência de vazamentos — testada com espuma de sabão nas conexões.</li></ul>"},

{id:"churrasqueira_p_faq", kind:"chapter", categoryId:"churrasqueira", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Churrasqueira · Capítulo 9 de 9 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Posso instalar em ambiente fechado, como uma varanda envidraçada?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. O produto é exclusivo para ambientes externos e permanentemente ventilados — nunca em locais internos ou fechados.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual gás a churrasqueira usa?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O padrão de fábrica é GLP (botijão). A conversão para Gás Natural (GN) é possível mediante contato com o SAC Invita.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quantos queimadores tem e qual a potência?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>2 queimadores tipo flauta, 12.000 BTU/h cada, totalizando 24.000 BTU/h (7 kW).</div></div></div><div class='faq-item'><div class='faq-question'><span>Como testar se há vazamento de gás nas conexões?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Aplique espuma de sabão em todas as conexões manuseadas. Se surgirem bolhas, refaça a conexão ou contate a assistência técnica.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso usar carvão nesta churrasqueira?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. O produto é exclusivo para gás — nunca utilize carvão ou qualquer combustível sólido.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual a distância mínima de móveis de madeira?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>50 cm de armários de madeira e 30 cm de paredes de alvenaria ou pedra.</div></div></div><div class='faq-item'><div class='faq-question'><span>As grelhas podem ir na máquina de lavar louça?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, as grelhas são compatíveis com máquina de lavar louça, além da limpeza manual com escova de aço.</div></div></div><div class='faq-item'><div class='faq-question'><span>O que fazer se sentir cheiro de gás?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Feche o registro de gás, ventile o ambiente, não acenda chamas ou aparelhos elétricos, e teste as conexões com espuma de sabão.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso instalar a rede de gás sozinho?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. A instalação da rede de gás deve ser feita por um técnico qualificado — a garantia não cobre defeitos por instalação inadequada.</div></div></div><div class='faq-item'><div class='faq-question'><span>Por que a chama está saindo amarela?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Geralmente indica sujeira ou ajuste incorreto do registro de ar do queimador. Limpe os furos e, se necessário, ajuste o registro de ar.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso aquecer potes fechados na churrasqueira?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. O aumento de pressão interna pode fazer a embalagem estourar, causando ferimentos.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia deste produto?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses contra defeitos de fabricação. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"adegas_p_comparativo", kind:"chapter", categoryId:"adegas", navTitle:"Comparativo dos Modelos", icon:"📊", title:"Visão Geral & Comparativo dos Modelos", kicker:"Adegas · Capítulo 1 de 24 · Visão Geral", html:"<p>A linha de Adegas Invita tem <strong>4 modelos</strong>, divididos em dois grupos de instalação: <strong>freestanding</strong> (14 e 34 garrafas, realocáveis, ideais para áreas gourmet) e <strong>built-in dual zone</strong> (26 e 46 garrafas, embutidos, com duas zonas de temperatura independentes e controle via app). Todos usam sistema de refrigeração a compressor com gás R600a, mais eficiente e silencioso.</p><div class='table-scroll'><table class='spec-table'><tr><th>Modelo</th><th>Instalação</th><th>Zonas</th><th>Prateleiras</th><th>Extras</th></tr><tr><td>14 garrafas</td><td>Freestanding</td><td>1</td><td>2 (madeira)</td><td>Porta com vidro duplo e proteção UV</td></tr><tr><td>26 garrafas</td><td>Built-in</td><td>2 (independentes)</td><td>Múltiplas</td><td>Wi-Fi (app Elettromec Connect), filtro de carvão ativado</td></tr><tr><td>34 garrafas</td><td>Freestanding</td><td>1</td><td>6 (madeira)</td><td>Energy Cut Off Memory, Tecnologia Low-E</td></tr><tr><td>46 garrafas</td><td>Built-in</td><td>2 (independentes)</td><td>Múltiplas</td><td>Wi-Fi (app Elettromec Connect), filtro de carvão ativado</td></tr></table></div><h2 class='section-title'>🌡️ Temperaturas Recomendadas por Tipo de Vinho</h2><table class='spec-table'><tr><th>Tipo de Vinho</th><th>Temperatura Ideal</th></tr><tr><td>Tinto</td><td>15 – 18 °C</td></tr><tr><td>Branco</td><td>9 – 14 °C</td></tr><tr><td>Rosé</td><td>10 – 11 °C</td></tr><tr><td>Espumantes / Champagne</td><td>5 – 8 °C</td></tr></table><div class='callout info'><span class='c-icon'>💡</span><p>Nos modelos <strong>dual zone</strong> (26 e 46 garrafas), a zona inferior deve estar sempre ajustada para temperatura igual ou superior à da zona superior — assim é possível guardar tintos e brancos/espumantes na mesma adega, cada um na sua {id:"adegas_p_14_resumo", kind:"chapter", categoryId:"adegas", navTitle:"Adega 14 Garrafas · Resumo", icon:"🍷", title:"Adega 14 Garrafas", kicker:"Adegas · Capítulo 2 de 24 · Visão Geral", html:"<p>A <strong>Adega Invita 14 Garrafas</strong> é a porta de entrada da linha: compacta, freestanding, ideal para quem busca praticidade e design em qualquer ambiente. Oferece controle preciso de temperatura, proteção UV e acabamento em aço inox.</p>"},

{id:"adegas_p_26_resumo", kind:"chapter", categoryId:"adegas", navTitle:"Adega 26 Garrafas · Resumo", icon:"🍷", title:"Adega 26 Garrafas", kicker:"Adegas · Capítulo 7 de 24 · Visão Geral", html:"<p>A <strong>Adega Invita 26 Garrafas</strong> é built-in (embutida) e <strong>dual zone</strong>: duas zonas de temperatura independentes na mesma adega, ideal para quem quer guardar tintos e brancos/espumantes juntos, cada um na temperatura certa. Conta com controle via app pelo celular.</p>"},

{id:"adegas_p_26_diferenciais", kind:"chapter", categoryId:"adegas", navTitle:"Adega 26 Garrafas · Diferenciais", icon:"🍷", title:"Diferenciais Comerciais", kicker:"Adegas · Capítulo 8 de 24 · Diferenciais", html:"<p>Conheça os principais diferenciais do <strong>Adega 26 Garrafas</strong> — a base para qualquer argumento de venda ou objeção de cliente.</p><div class='feature-grid'><div class='feature-card'><span class='f-icon'>🧊</span><h4>Dual Zone</h4><p>Duas zonas de temperatura independentes — a inferior sempre igual ou mais fria que a superior.</p></div><div class='feature-card'><span class='f-icon'>🧱</span><h4>Built-in (Embutir)</h4><p>Instalação embutida em bancada, com ventilação 100% frontal — não precisa de recuo lateral para ar.</p></div><div class='feature-card'><span class='f-icon'>📶</span><h4>Wi-Fi · App Elettromec Connect</h4><p>Controle e monitoramento das zonas direto pelo celular, via Bluetooth + Wi-Fi.</p></div><div class='feature-card'><span class='f-icon'>🌬️</span><h4>Filtro de Carvão Ativado</h4><p>Mantém a qualidade do ar interno e evita odores indesejáveis — trocar a cada 6-12 meses.</p></div><div class='feature-card'><span class='f-icon'>🔒</span><h4>Trava de Segurança Infantil</h4><p>Bloqueia o painel pressionando ON/OFF + Lâmpada por 3 segundos.</p></div><div class='feature-card'><span class='f-icon'>🔄</span><h4>Porta Reversível</h4><p>A porta pode ser invertida para abrir do lado esquerdo ou direito, conforme o projeto.</p></div></div><h2 class='section-title'>🎬 Vídeo · Diferenciais</h2><div class='media-block'><div class='media-label'>▶️ Vídeo · Diferenciais Adega Invita 26 Garrafas</div><video controls preload='metadata'><source src='/media/adegas/adegas_p_26_diferenciais__video-diferenciais-adega-invita-26-garra.mp4' type='video/mp4'></video></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Diferenciais</div><img src='/media/adegas/adegas_p_26_diferenciais__infografico-diferenciais.jpg' alt='Infográfico com os diferenciais da Adega Invita 26 garrafas' loading='lazy'></div>", quiz:{"question":"Como a Adega 26 Garrafas trava o painel para segurança infantil?","options":["Girando uma chave física","Pressionando ON/OFF + Lâmpada por 3 segundos","Apenas através do aplicativo","Não possui trava de segurança"],"correct":1,"explain":"A trava de segurança infantil é ativada pressionando ON/OFF e o botão de Lâmpada simultaneamente por 3 segundos."}},

{id:"adegas_p_26_specs", kind:"chapter", categoryId:"adegas", navTitle:"Adega 26 Garrafas · Especificações", icon:"🍷", title:"Especificações Técnicas", kicker:"Adegas · Capítulo 9 de 24 · Ficha Técnica", html:"<table class='spec-table'><tr><td>Código</td><td>i-CV-2BI-31-XV-2ATA / i-CV-2BI-31-VP-2ATA</td></tr><tr><td>Instalação</td><td>Embutir (Built-in)</td></tr><tr><td>Capacidade</td><td>26 garrafas</td></tr><tr><td>Quantidade de zonas</td><td>2 (independentes)</td></tr><tr><td>Dimensões do produto (L×A×P)</td><td>380 × 865 × 570 mm</td></tr><tr><td>Dimensões do nicho (L×A×P)</td><td>390 × 875 × 620 mm</td></tr><tr><td>Folga lateral / superior / traseira</td><td>5 mm / 10 mm / 50 mm</td></tr><tr><td>Peso líquido</td><td>36,4 – 36,5 kg</td></tr><tr><td>Potência / Tensão</td><td>100 W / 220 V</td></tr><tr><td>Conexão Wi-Fi</td><td>Sim</td></tr></table><div class='callout info'><span class='c-icon'>ℹ️</span><p>Informações técnicas podem sofrer alterações sem aviso prévio. Em caso de dúvida, consulte a versão online do Manual do Consumidor em invitacasa.com.br.</p></div>", quiz:{"question":"Na Adega 26 garrafas (dual zone), como devem estar ajustadas as duas zonas entre si?","options":["Zona superior sempre mais fria que a inferior","As duas devem ter a mesma temperatura, sempre","A zona inferior deve estar igual ou mais fria que a superior","Não há relação entre as zonas"],"correct":2,"explain":"A zona inferior deve estar ajustada para temperatura igual ou superior à zona superior — ou seja, a zona superior é sempre a mais fria (ideal para espumantes/brancos), e a inferior mais quente (ideal para tintos)."}},

{id:"adegas_p_34_resumo", kind:"chapter", categoryId:"adegas", navTitle:"Adega 34 Garrafas · Resumo", icon:"🍷", title:"Adega 34 Garrafas", kicker:"Adegas · Capítulo 12 de 24 · Visão Geral", html:"<p>A <strong>Adega Invita 34 Garrafas</strong> é freestanding, com 6 prateleiras em madeira e a exclusiva tecnologia <strong>Energy Cut Off Memory</strong>, que memoriza a temperatura programada em caso de queda de energia — não é preciso reconfigurar depois.</p>"},

{id:"adegas_p_34_specs", kind:"chapter", categoryId:"adegas", navTitle:"Adega 34 Garrafas · Especificações", icon:"🍷", title:"Especificações Técnicas", kicker:"Adegas · Capítulo 14 de 24 · Ficha Técnica", html:"<table class='spec-table'><tr><td>Código</td><td>i-CV-FS-34-XV-1ATA (127V) / -2ATA (220V)</td></tr><tr><td>Instalação</td><td>Freestanding</td></tr><tr><td>Capacidade</td><td>34 garrafas · 6 prateleiras</td></tr><tr><td>Comando</td><td>Touch</td></tr><tr><td>Faixa de temperatura</td><td>5°C a 20°C</td></tr><tr><td>Dimensões do produto (L×A×P)</td><td>480 × 870 × 430 mm</td></tr><tr><td>Peso líquido / bruto</td><td>25,4 kg / 27,8 kg</td></tr><tr><td>Potência</td><td>108 W</td></tr><tr><td>Classe climática</td><td>ST</td></tr></table><div class='callout info'><span class='c-icon'>ℹ️</span><p>Informações técnicas podem sofrer alterações sem aviso prévio. Em caso de dúvida, consulte a versão online do Manual do Consumidor em invitacasa.com.br.</p></div>", quiz:{"question":"O que faz a tecnologia Energy Cut Off Memory da Adega 34 garrafas?","options":["Desliga a adega automaticamente à noite","Memoriza a temperatura programada antes de uma queda de energia","Corta o fornecimento de energia em caso de superaquecimento","Economiza energia reduzindo o brilho do display"],"correct":1,"explain":"Ao voltar a energia após uma queda, a adega retoma automaticamente a última temperatura programada, sem precisar reconfigurar o painel."}},
