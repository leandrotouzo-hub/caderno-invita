{id:"garantia_final", kind:"chapter", categoryId:"garantia", navTitle:"Garantia Invita", icon:"🛡️", title:"Garantia Invita", kicker:"Política de Garantia · Válida para toda a linha Invita", html:"<p>Esta seção descreve a política de garantia oficial da Invita, aplicável a todos os produtos da marca — Linha Quente e Linha Fria.</p><div class='feature-grid'><div class='feature-card'><span class='f-icon'>⏱️</span><h4>24 Meses de Tranquilidade</h4><p>O prazo total de 2 anos combina 90 dias de garantia legal com 21 meses de garantia contratual adicional.</p></div><div class='feature-card'><span class='f-icon'>🔧</span><h4>O que está protegido?</h4><p>Cobre especificamente defeitos de fabricação, incluindo a substituição de peças defeituosas e a mão de obra necessária para o reparo.</p></div><div class='feature-card'><span class='f-icon'>👷</span><h4>Use a Rede Credenciada</h4><p>A instalação deve ser feita obrigatoriamente por profissionais credenciados — instalação por pessoal não autorizado anula a garantia.</p></div><div class='feature-card'><span class='f-icon'>🏠</span><h4>Uso Residencial e Energização</h4><p>O produto deve ser usado exclusivamente para fins residenciais e conectado na voltagem correta especificada na etiqueta.</p></div><div class='feature-card'><span class='f-icon'>✨</span><h4>Cuidado com o Acabamento</h4><p>Utilize apenas limpadores suaves e não abrasivos — detergentes fortes e produtos químicos agressivos danificam o produto e invalidam a garantia.</p></div><div class='feature-card'><span class='f-icon'>🚫</span><h4>Sem Reparos \"Por Conta Própria\"</h4><p>Qualquer alteração ou conserto deve ser realizado por técnico credenciado Invita — intervenções não oficiais causam perda imediata da garantia.</p></div><div class='feature-card'><span class='f-icon'>📎</span><h4>Guarde o Kit de Documentos</h4><p>Mantenha sempre à mão a Nota Fiscal, o Certificado de Garantia e o Manual, além de preservar intacta a etiqueta de número de série.</p></div><div class='feature-card'><span class='f-icon'>📞</span><h4>Como Pedir Ajuda</h4><p>Em caso de dúvidas ou problemas, contate o SAC antes de qualquer intervenção: 0800 723 1202 ou sac@invitacasa.com.br.</p></div></div><div class='callout danger'><span class='c-icon'>⚠️</span><p><strong>Atenção:</strong> o uso em desacordo com o manual ou reparos não autorizados resultam na perda da garantia.</p></div><h2 class='section-title'>🎧 Áudio · Garantia Invita</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Garantia Invita</div><div class='media-body'><audio class='custom-audio' id='garAud1' controls preload='none' src='media/garantia/audio-garantia.mp3'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='garAud1' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='garAud1' data-rate='1'>1x</button><button class='speed-btn' data-target='garAud1' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='garAud1' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='garAud1' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Como Manter a Garantia Ativa</div><img src='media/garantia/infocard-garantia.jpg' alt='Infográfico com o guia prático de como manter a garantia Invita ativa' loading='lazy'></div>"},

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {currentIndex:0, readPages:[], quizAnswers:{}, fontScale:1, expandedCategory:null};
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
state.currentIndex = 0;
state.expandedCategory = null;
if(state.fontScale) document.documentElement.style.setProperty('--font-scale', state.fontScale);

var bookEl = document.getElementById("book");
var overlay = document.getElementById("overlay");
var sideMenu = document.getElementById("sideMenu");

function pageIndex(id){ for(var i=0;i<PAGES.length;i++){ if(PAGES[i].id===id) return i; } return 0; }
function chaptersOf(catId){ return PAGES.filter(function(p){ return p.categoryId===catId && p.kind==="chapter"; }); }
function allChapters(){ return PAGES.filter(function(p){ return p.kind==="chapter"; }); }
function currentScopeChapters(){
  var page = PAGES[state.currentIndex];
  if(page.categoryId) return chaptersOf(page.categoryId);
  return allChapters();
}
function catMeta(id){ for(var i=0;i<CATEGORIES_META.length;i++){ if(CATEGORIES_META[i].id===id) return CATEGORIES_META[i]; } return null; }

function toggleMenu(force){
  var open = force !== undefined ? force : !sideMenu.classList.contains("open");
  sideMenu.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
}
document.getElementById("btnMenu").addEventListener("click", function(){ toggleMenu(); });
overlay.addEventListener("click", function(){ toggleMenu(false); });
document.getElementById("brandHome").addEventListener("click", function(){ goTo(pageIndex("home")); });
document.querySelector(".side-menu > .menu-item[data-idx='1']").addEventListener("click", function(){ goTo(pageIndex("home")); toggleMenu(false); });

document.getElementById("btnFontUp").addEventListener("click", function(){
  state.fontScale = Math.min(1.25, (state.fontScale||1) + 0.08);
  document.documentElement.style.setProperty('--font-scale', state.fontScale);
  saveState();
});
document.getElementById("btnFontDown").addEventListener("click", function(){
  state.fontScale = Math.max(0.85, (state.fontScale||1) - 0.08);
  document.documentElement.style.setProperty('--font-scale', state.fontScale);
  saveState();
});

function renderMenu(){
  var wrap = document.getElementById("menuChapters");
  var currentPage = PAGES[state.currentIndex];
  var html = "";
  CATEGORIES_META.forEach(function(cat){
    if(cat.status !== "ready"){
      html += "<div class='menu-cat-soon'><span class='m-icon'>"+cat.icon+"</span><span>"+cat.label+"</span><span class='soon-tag'>em breve</span></div>";
      return;
    }
    var isActiveCat = currentPage.categoryId === cat.id;
    var isExpanded = state.expandedCategory === cat.id;
    var coverIdx = pageIndex(cat.id+"_cover");
    html += "<div class='menu-cat-header"+(isActiveCat?" active-cat":"")+(isExpanded?" expanded":"")+"' data-cat='"+cat.id+"' data-cover-idx='"+coverIdx+"'>" +
      "<span class='m-icon'>"+cat.icon+"</span><span>"+cat.label+"</span>" +
      "<span class='cat-chevron'>"+(isExpanded?"▾":"▸")+"</span></div>";
    if(isExpanded){
      chaptersOf(cat.id).forEach(function(ch){
        var idx = pageIndex(ch.id);
        var isRead = state.readPages.indexOf(ch.id) !== -1;
        html += "<div class='menu-item nested"+(state.currentIndex===idx?" active":"")+"' data-idx='"+idx+"'><span class='m-icon'>"+ch.icon+"</span><span>"+ch.navTitle+"</span>"+(isRead?"<span class='m-check'>&#9679;</span>":"")+"</div>";
      });
      var endIdx = pageIndex(cat.id+"_end");
      html += "<div class='menu-item nested"+(state.currentIndex===endIdx?" active":"")+"' data-idx='"+endIdx+"'><span class='m-icon'>🏁</span><span>Resumo Final</span></div>";
    }
  });
  var garantiaIdx = pageIndex("garantia_final");
  var fimIdx = pageIndex("fim_geral");
  html += "<div class='menu-divider'></div>" +
    "<div class='menu-item"+(state.currentIndex===garantiaIdx?" active":"")+"' data-idx='"+garantiaIdx+"'><span class='m-icon'>🛡️</span><span>Garantia Invita</span></div>" +
    "<div class='menu-item"+(state.currentIndex===fimIdx?" active":"")+"' data-idx='"+fimIdx+"'><span class='m-icon'>🎓</span><span>Conclusão</span></div>";
  wrap.innerHTML = html;
  wrap.querySelectorAll(".menu-cat-header").forEach(function(el){
    el.addEventListener("click", function(){
      var catId = el.getAttribute("data-cat");
      var coverIdx = parseInt(el.getAttribute("data-cover-idx"),10);
      if(state.expandedCategory === catId){
        state.expandedCategory = null;
        saveState();
        renderMenu();
      } else {
        goTo(coverIdx);
        toggleMenu(false);
      }
    });
  });
  wrap.querySelectorAll(".menu-item[data-idx]").forEach(function(el){
    el.addEventListener("click", function(){
      goTo(parseInt(el.getAttribute("data-idx"),10));
      toggleMenu(false);
    });
  });
  var homeItem = document.querySelector(".side-menu > .menu-item[data-idx='1']");
  if(homeItem) homeItem.classList.toggle("active", state.currentIndex===pageIndex("home"));
}

function renderProgress(){
  var scope = currentScopeChapters();
  var total = scope.length;
  var scopeIds = scope.map(function(p){return p.id;});
  var read = state.readPages.filter(function(id){return scopeIds.indexOf(id)!==-1;}).length;
  document.getElementById("progressBar").style.width = (total? (read/total*100):0) + "%";
  document.getElementById("readCounter").textContent = read + "/" + total;
  var page = PAGES[state.currentIndex];
  var brandLabel = "Início";
  if(page.id === "capa"){ brandLabel = "Capa"; }
  else if(page.id === "garantia_final"){ brandLabel = "Garantia"; }
  else if(page.id === "fim_geral"){ brandLabel = "Conclusão"; }
  else if(page.categoryId){ var m = catMeta(page.categoryId); if(m) brandLabel = m.label; }
  document.getElementById("brandText").innerHTML = "Caderno de Estudo &middot; <b>"+brandLabel+"</b>";
}

function quizBlockHtml(page){
  if(!page.quiz) return "";
  var q = page.quiz;
  var answered = state.quizAnswers[page.id];
  var optsHtml = "";
  q.options.forEach(function(opt, i){
    var cls = "quiz-option";
    if(answered !== undefined){
      cls += " disabled";
      if(i === q.correct) cls += " correct";
      else if(i === answered) cls += " wrong";
    }
    optsHtml += "<div class='"+cls+"' data-idx='"+i+"'><span class='opt-letter'>"+String.fromCharCode(65+i)+"</span><span>"+opt+"</span></div>";
  });
  return "<div class='quiz-box' data-page='"+page.id+"'>" +
    "<div class='quiz-eyebrow'>🎯 Teste seu conhecimento</div>" +
    "<div class='quiz-question'>"+q.question+"</div>" +
    "<div class='quiz-options'>"+optsHtml+"</div>" +
    "<div class='quiz-explain"+(answered!==undefined?" show":"")+"'>"+q.explain+"</div>" +
    "</div>";
}

function handleQuizClick(e){
  var opt = e.target.closest(".quiz-option");
  if(!opt || opt.classList.contains("disabled")) return;
  var box = opt.closest(".quiz-box");
  var pageId = box.getAttribute("data-page");
  var idx = parseInt(opt.getAttribute("data-idx"),10);
  state.quizAnswers[pageId] = idx;
  saveState();
  var __scrollKeep = bookEl.scrollTop;
  renderPage();
  bookEl.scrollTop = __scrollKeep;
}

function handleFaqClick(e){
  var q = e.target.closest(".faq-question");
  if(!q) return;
  var item = q.closest(".faq-item");
  var answer = item.querySelector(".faq-answer");
  var isOpen = item.classList.contains("open");
  bookEl.querySelectorAll(".faq-item.open").forEach(function(o){
    if(o !== item){ o.classList.remove("open"); o.querySelector(".faq-answer").style.maxHeight = null; }
  });
  item.classList.toggle("open", !isOpen);
  answer.style.maxHeight = (!isOpen) ? (answer.scrollHeight + "px") : null;
}

function handleSpeedClick(e){
  var btn = e.target.closest(".speed-btn");
  if(!btn) return;
  var targetId = btn.getAttribute("data-target");
  var rate = parseFloat(btn.getAttribute("data-rate"));
  var audioEl = document.getElementById(targetId);
  if(audioEl) audioEl.playbackRate = rate;
  var group = btn.closest(".speed-controls");
  group.querySelectorAll(".speed-btn").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
}

function handleCatCardClick(e){
  var card = e.target.closest(".cat-card");
  if(!card || card.classList.contains("soon")) return;
  var catId = card.getAttribute("data-cat");
  goTo(pageIndex(catId+"_cover"));
}

bookEl.addEventListener("click", function(e){
  handleQuizClick(e);
  handleFaqClick(e);
  handleSpeedClick(e);
  handleCatCardClick(e);
});

function homeHtml(){
  var readyCats = CATEGORIES_META.filter(function(c){return c.status==="ready";});
  var totalAll = allChapters().length;
  var readAll = state.readPages.filter(function(id){
    var p = PAGES[pageIndex(id)];
    return p && p.kind==="chapter";
  }).length;
  var cardsHtml = "";
  CATEGORIES_META.forEach(function(cat){
    var soon = cat.status !== "ready";
    cardsHtml += "<div class='cat-card"+(soon?" soon":"")+"'"+(soon?"":" data-cat='"+cat.id+"'")+">" +
      "<div class='cc-top'><span class='cc-icon'>"+cat.icon+"</span><span class='cc-tag'>"+(soon?"em breve":"disponível")+"</span></div>" +
      "<h4>"+cat.label+"</h4><p>"+cat.subtitle+"</p></div>";
  });
  return "<div class='cover-page'>" +
    "<div class='deco-line' style='width:280px;height:280px; top:-100px; right:-90px;'></div>" +
    "<div class='deco-line' style='width:190px;height:190px; bottom:-70px; left:-50px;'></div>" +
    "<div class='cover-eyebrow'><span class='cb-dot'></span><span>Uma mensagem antes de começar</span></div>" +
    "<h1 class='cover-title'>Bem-vindo(a) ao<br><em>Caderno de Estudo</em></h1>" +
    "<p class='cover-lead'>Olá, tudo bem? Leandro aqui&hellip; Que bom que você está acessando meu conteúdo de capacitação.</p>" +
    "<p class='cover-lead'>Depois de ter participado de vários treinamentos online patrocinados pelas indústrias ao longo desses últimos anos, eu senti a necessidade de trazer mais informações e proporcionar mais conteúdos sobre tudo o que havia sido exposto, mas nem sempre eu encontrava o material necessário, e nos formatos que eu desejava.</p>" +
    "<p class='cover-lead'>Foi pensando nisso que eu desenvolvi esse material. Tenho certeza que o que você vai encontrar aqui, vai te ajudar muito!</p>" +
    "<h2 class='section-title'>🔎 De onde saiu tudo isso?</h2>" +
    "<p class='cover-lead'>Eu identifiquei que o modelo atual de treinamento de produtos, de modo geral, ocorre em um formato que não garante que o conhecimento necessário para a atividade de venda seja, de fato, absorvido e retido. Isso não é uma percepção isolada: é o resultado de um diagnóstico estruturado sobre como os treinamentos técnicos acontecem hoje, e por que esse formato — por mais bem-intencionado que seja — não garante a memorização do conteúdo.</p>" +
    "<p class='cover-lead'>Hoje, a capacitação técnica acontece quase sempre por reuniões remotas, via Microsoft Teams, Google Meet ou outras plataformas, e quase sempre dentro do horário comercial. Cinco fatores, combinados, comprometem a retenção desse conteúdo:</p>" +
    "<ol class='styled' style='max-width:60ch;'>" +
    "<li><strong>Interrupções constantes.</strong> As reuniões acontecem no mesmo horário em que você atende clientes, responde WhatsApp e resolve demandas da loja. Cada interrupção exige alguns minutos para que você recupere o foco novamente — e isso nem sempre acontece.</li>" +
    "<li><strong>Duração além do limite de atenção.</strong> Os treinamentos duram de 1:30 a 2:00 hs, mas estudos mostram que a atenção sustentada começa a cair já nos primeiros 10 a 20 minutos. Boa parte do conteúdo técnico mais importante é apresentada exatamente na fase em que a sua atenção já está mais baixa.</li>" +
    "<li><strong>Nenhum material para consultar depois.</strong> Ao final da reunião, não fica nenhuma gravação, transcrição ou apresentação disponível. Tudo que resta é o que você conseguiu reter ou anotar durante a própria sessão.</li>" +
    "<li><strong>Nenhuma repetição espaçada.</strong> O treinamento acontece em média a cada 30 ou 45 dias, sem qualquer mecanismo de reforço ou revisão. E sem repetição, o seu conhecimento é perdido. Tem um estudo, chamado &ldquo;A curva de Ebbinghaus&rdquo;, que mostra que perdemos a maior parte do que aprendemos já nas primeiras 24 horas, se não houver revisão ativa.</li>" +
    "<li><strong>Formato de um canal só.</strong> A reunião é majoritariamente auditiva, sem interação prática com o produto e com pouca participação ativa. Você ouve, não pratica, e nem sempre consegue tirar dúvidas na hora — em parte porque às vezes ficamos com receio de perguntar, ao mesmo tempo que, se todo mundo perguntar, o tempo extrapola ainda mais. Com tudo isso, o aprendizado fica comprometido.</li>" +
    "</ol>" +
    "<p class='cover-lead'>O resultado prático desses cinco fatores juntos: você participa do treinamento, mas nem sempre o conhecimento fica disponível no momento em que você mais precisa — na frente do cliente, na hora de responder uma pergunta técnica.</p>" +
    "<p class='cover-lead'>Foi para resolver exatamente isso que eu desenvolvi este caderno interativo. Ele não substitui os treinamentos online — você deve continuar participando sempre que houverem, até porque ele é sempre a fonte oficial de informações sobre os produtos. O meu desejo é que você faça desse caderno interativo uma fonte de reforço e consulta, sempre que precisar, sem depender de gravação ou anotação.</p>" +
    "<p class='cover-lead'>Vai permitir que você revise e estude no seu próprio ritmo, com barra de progresso e marcação de capítulos lidos, para você voltar exatamente onde parou.</p>" +
    "<p class='cover-lead'>Você vai encontrar informação em múltiplos formatos — texto, áudio, vídeo, quiz com perguntas interativas e FAQ, com as perguntas mais frequentes — porque aprendemos mais e melhor quando o conteúdo chega por mais de um canal ao mesmo tempo.</p>" +
    "<p class='cover-lead'>Por fim, vai te ajudar a consolidar em um único lugar o que hoje está espalhado entre memória, anotações soltas e reuniões passadas.</p>" +
    "<p class='cover-lead'>Bons estudos! A gente se vê! Um grande abraço.<br>Leandro.</p>" +
    "<h2 class='section-title' style='margin-top:8px;'>📚 Escolha uma categoria para começar</h2>" +
    "<div class='cat-grid'>" + cardsHtml + "</div>" +
    "<div class='cover-credit'>Leandro Touzo · Representação Estratégica &middot; "+readAll+"/"+totalAll+" capítulos lidos no total</div>" +
    "</div>";
}

function coverHtml(page){
  var statsHtml = "";
  page.stats.forEach(function(s){
    statsHtml += "<div class='stat-item'><div class='stat-num'>"+s.n+"</div><div class='stat-label'>"+s.l+"</div></div>";
  });
  return "<div class='cover-page'>" +
    "<div class='deco-line' style='width:280px;height:280px; top:-100px; right:-90px;'></div>" +
    "<div class='deco-line' style='width:190px;height:190px; bottom:-70px; left:-50px;'></div>" +
    "<div class='cover-eyebrow'><span class='cb-dot'></span><span>"+page.coverEyebrow+"</span></div>" +
    "<h1 class='cover-title'>"+page.coverTitle+"</h1>" +
    "<div class='cover-model'>"+page.coverModel+"</div>" +
    "<p class='cover-lead'>"+page.coverLead+"</p>" +
    "<div class='stat-row'>"+statsHtml+"</div>" +
    "<button class='btn-gold' id='btnStart'>Começar a leitura →</button>" +
    "<button class='btn-ghost' id='btnBackHome'>← Voltar ao Início</button>" +
    "<div class='cover-credit'>Leandro Touzo · Representação Estratégica</div>" +
    "</div>";
}

function summaryHtml(page){
  var cat = catMeta(page.categoryId);
  var chapters = chaptersOf(page.categoryId);
  var totalChapters = chapters.length;
  var chapterIds = chapters.map(function(p){return p.id;});
  var readChapters = state.readPages.filter(function(id){return chapterIds.indexOf(id)!==-1;}).length;
  var catQuizzes = chapters.filter(function(p){return p.quiz;});
  var quizAnswered = 0, quizCorrect = 0;
  catQuizzes.forEach(function(p){
    if(state.quizAnswers[p.id] !== undefined){
      quizAnswered++;
      if(state.quizAnswers[p.id] === p.quiz.correct) quizCorrect++;
    }
  });
  return "<div class='end-page'>" +
    "<div class='kicker'>Fim do Caderno · "+cat.label+"</div>" +
    "<h1 class='page-title' style='color:var(--cream);'>Você concluiu o estudo de<br><em style=\"font-style:italic;color:var(--gold-light);\">"+cat.label+"</em></h1>" +
    "<div style='margin-top:24px;'>" +
    "<div class='stat-box'><div class='stat-num'>"+readChapters+"/"+totalChapters+"</div><div class='stat-label'>Capítulos lidos</div></div>" +
    "<div class='stat-box'><div class='stat-num'>"+quizCorrect+"/"+catQuizzes.length+"</div><div class='stat-label'>Acertos nos quizzes</div></div>" +
    "<div class='stat-box'><div class='stat-num'>"+quizAnswered+"/"+catQuizzes.length+"</div><div class='stat-label'>Perguntas respondidas</div></div>" +
    "</div>" +
    "<div class='msg-box'>Obrigado por estudar com este caderno interativo. Use o menu lateral para visitar outra categoria, ou revisitar qualquer capítulo sempre que precisar — não há ordem obrigatória.</div>" +
    "<button class='btn-ghost' id='btnBackHome2'>← Voltar ao Início</button>" +
    "<br><button class='link-reset' id='btnResetProgress'>Reiniciar todo o progresso de leitura</button>" +
    "</div>";
}

function titleCoverHtml(){
  return "<div class='cover-page cover-title-page'>" +
    "<div class='deco-line' style='width:280px;height:280px; top:-100px; right:-90px;'></div>" +
    "<div class='deco-line' style='width:190px;height:190px; bottom:-70px; left:-50px;'></div>" +
    "<h1 class='cover-title'>Caderno Interativo<br>de Estudo &mdash; <em>Invita</em></h1>" +
    "<p class='cover-lead'>Um material vivo de consulta e reforço técnico e comercial: revise no seu próprio ritmo, sempre que precisar, sem depender de gravação ou anotação.</p>" +
    "<button class='btn-gold' id='btnOpenBook'>Abrir o caderno →</button>" +
    "<div class='cover-logo-footer'><img src='media/logos/ltre_lockup_white_gold.png' alt='Leandro Touzo · Representação Estratégica' class='cover-logo-footer-img'></div>" +
    "</div>";
}

function finalEndHtml(){
  var chapters = allChapters();
  var totalChapters = chapters.length;
  var chapterIds = chapters.map(function(p){return p.id;});
  var readChapters = state.readPages.filter(function(id){return chapterIds.indexOf(id)!==-1;}).length;
  var quizzes = chapters.filter(function(p){return p.quiz;});
  var quizAnswered = 0, quizCorrect = 0;
  quizzes.forEach(function(p){
    if(state.quizAnswers[p.id] !== undefined){
      quizAnswered++;
      if(state.quizAnswers[p.id] === p.quiz.correct) quizCorrect++;
    }
  });
  return "<div class='end-page'>" +
    "<h1 class='page-title' style='color:var(--cream);'>Você concluiu o<br><em style=\"font-style:italic;color:var(--gold-light);\">Caderno Interativo de Estudo — Invita</em></h1>" +
    "<div style='margin-top:24px;'>" +
    "<div class='stat-box'><div class='stat-num'>"+readChapters+"/"+totalChapters+"</div><div class='stat-label'>Capítulos lidos no total</div></div>" +
    "<div class='stat-box'><div class='stat-num'>"+quizCorrect+"/"+quizzes.length+"</div><div class='stat-label'>Acertos nos quizzes</div></div>" +
    "<div class='stat-box'><div class='stat-num'>"+quizAnswered+"/"+quizzes.length+"</div><div class='stat-label'>Perguntas respondidas</div></div>" +
    "</div>" +
    "<div class='msg-box'>Obrigado por dedicar seu tempo a este material. Ele continua aqui, disponível sempre que você precisar de reforço em qualquer categoria, produto ou capítulo — não existe ordem obrigatória nem prazo. Volte sempre que precisar, inclusive antes de uma venda.</div>" +
    "<div class='cover-logo-footer' style='margin:26px 0 6px;'><img src='media/logos/ltre_lockup_white_gold.png' alt='Leandro Touzo · Representação Estratégica' class='cover-logo-final-img'></div>" +
    "<button class='btn-ghost' id='btnBackHome3'>← Voltar ao Início</button>" +
    "</div>";
}

function renderPage(){
  var page = PAGES[state.currentIndex];
  var isRead = page.kind==="chapter" && state.readPages.indexOf(page.id) !== -1;
  var inner = "";
  var isDarkPage = page.kind === "cover" || page.kind === "end" || page.kind === "home" || page.kind === "titlecover" || page.kind === "finalend";
  bookEl.classList.toggle("dark", isDarkPage);

  if(page.kind === "titlecover"){
    inner = titleCoverHtml();
  } else if(page.kind === "finalend"){
    inner = finalEndHtml();
  } else if(page.kind === "home"){
    inner = homeHtml();
  } else if(page.kind === "cover"){
    inner = coverHtml(page);
  } else if(page.kind === "end"){
    inner = summaryHtml(page);
  } else {
    inner =
      (isRead ? "<span class='read-tag'>&#10003; Lido</span>" : "") +
      "<div class='kicker'>"+page.kicker+"</div>" +
      "<h1 class='page-title'>"+page.title+"</h1>" +
      page.html +
      quizBlockHtml(page);
  }

  inner += "<div class='scroll-cue' id='scrollCue' aria-hidden='true'><span class='scroll-cue-pill'>↓ Role para continuar lendo</span></div>";

  bookEl.classList.remove("page-show");
  bookEl.classList.add("page-fade");
  bookEl.innerHTML = inner;
  bookEl.scrollTop = 0;
  window.scrollTo(0, 0);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      bookEl.classList.remove("page-fade");
      bookEl.classList.add("page-show");
      updateScrollCue();
    });
  });

  var startBtn = document.getElementById("btnStart");
  if(startBtn) startBtn.addEventListener("click", function(){ goTo(state.currentIndex+1); });
  var openBookBtn = document.getElementById("btnOpenBook");
  if(openBookBtn) openBookBtn.addEventListener("click", function(){ goTo(pageIndex("home")); });
  var backHome = document.getElementById("btnBackHome");
  if(backHome) backHome.addEventListener("click", function(){ goTo(pageIndex("home")); });
  var backHome2 = document.getElementById("btnBackHome2");
  if(backHome2) backHome2.addEventListener("click", function(){ goTo(pageIndex("home")); });
  var backHome3 = document.getElementById("btnBackHome3");
  if(backHome3) backHome3.addEventListener("click", function(){ goTo(pageIndex("home")); });
  var resetBtn = document.getElementById("btnResetProgress");
  if(resetBtn) resetBtn.addEventListener("click", resetProgress);

  renderNav();
  renderMenu();
  renderProgress();

  if(page.kind==="chapter" && state.readPages.indexOf(page.id) === -1){
    setTimeout(function(){ markCurrentAsRead(); }, 900);
  }
}

function updateScrollCue(){
  var cue = document.getElementById("scrollCue");
  if(!cue) return;
  var scrollable = bookEl.scrollHeight > bookEl.clientHeight + 40;
  var nearBottom = bookEl.scrollTop + bookEl.clientHeight >= bookEl.scrollHeight - 30;
  cue.style.display = (scrollable && !nearBottom) ? "flex" : "none";
}
bookEl.addEventListener("scroll", updateScrollCue);

function goTo(idx){
  if(idx < 0 || idx >= PAGES.length) return;
  state.currentIndex = idx;
  state.expandedCategory = PAGES[idx].categoryId || null;
  saveState();
  renderPage();
}

function markCurrentAsRead(){
  var page = PAGES[state.currentIndex];
  if(page.kind !== "chapter") return;
  if(state.readPages.indexOf(page.id) === -1){
    state.readPages.push(page.id);
    saveState();
    renderProgress();
    var tag = bookEl.querySelector(".read-tag");
    if(!tag && bookEl.firstChild){
      var span = document.createElement("span");
      span.className = "read-tag";
      span.innerHTML = "&#10003; Lido";
      bookEl.insertBefore(span, bookEl.firstChild);
    }
    renderMenu();
  }
}

function resetProgress(){
  state = {currentIndex:0, readPages:[], quizAnswers:{}, fontScale:state.fontScale};
  saveState();
  renderPage();
}

function renderNav(){
  var prevBtn = document.getElementById("btnPrev");
  var nextBtn = document.getElementById("btnNext");
  prevBtn.disabled = state.currentIndex <= 0;
  nextBtn.disabled = state.currentIndex >= PAGES.length - 1;
  nextBtn.textContent = state.currentIndex >= PAGES.length - 1 ? "Fim" : "Próxima →";
  document.getElementById("pageInd").textContent = (state.currentIndex+1) + " / " + PAGES.length;
}
document.getElementById("btnPrev").addEventListener("click", function(){ goTo(state.currentIndex-1); });
document.getElementById("btnNext").addEventListener("click", function(){ goTo(state.currentIndex+1); });

renderPage();
</script>
<script type="module" src="firebase-init.js"></script>
