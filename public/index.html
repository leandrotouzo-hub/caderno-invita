{id:"adegas_p_problemas", kind:"chapter", categoryId:"adegas", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Adegas · Capítulo 22 de 24 · Diagnóstico Rápido", html:"<p>Problemas comuns e válidos para toda a linha de adegas Invita (freestanding e built-in):</p><div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Não liga</td><td>Disjuntor desligado ou cabo desconectado</td><td>Verifique o disjuntor e a conexão do cabo</td></tr><tr><td>Não liga após queda de energia</td><td>Proteção do sistema</td><td>Aguarde 5 minutos antes de religar</td></tr><tr><td>Refrigeração insuficiente</td><td>Temp. ambiente alta, porta aberta com frequência, distâncias mínimas não respeitadas</td><td>Ajuste a temperatura, feche bem a porta, revise o espaçamento de instalação</td></tr><tr><td>Liga e desliga com frequência</td><td>Ambiente quente, porta mal fechada, vedação comprometida</td><td>Reduza a temperatura, verifique a vedação; se persistir, chame o Serviço Autorizado</td></tr><tr><td>Vibrações</td><td>Produto desnivelado</td><td>Ajuste os pés para apoio total no piso</td></tr><tr><td>Ruídos durante o uso</td><td>Fluxo do fluido refrigerante, dilatação das paredes internas</td><td>Normal — faz parte do funcionamento</td></tr><tr><td>Condensação na porta</td><td>Umidade acima de 70%, porta aberta com frequência</td><td>Seque com pano limpo; ventile o ambiente; evite temperaturas muito baixas</td></tr><tr><td>Porta não fecha corretamente</td><td>Produto desnivelado, sujeira na vedação, prateleiras mal encaixadas</td><td>Nivele os pés, limpe a vedação, reposicione as prateleiras</td></tr><tr><td>Odores internos</td><td>Produto novo ou inativo por longo período</td><td>Ventile o interior por algumas horas; produto novo perde o odor com o uso</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>Anote as informações da etiqueta de especificações (parte traseira do produto) antes de contatar o SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"adegas_p_glossario", kind:"chapter", categoryId:"adegas", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Adegas · Capítulo 23 de 24 · Termos Essenciais", html:"<ul class='styled'><li><strong>Freestanding:</strong> instalação livre/portátil — a adega pode ser realocada, não é embutida.</li><li><strong>Built-in (Embutir):</strong> instalação embutida em bancada/móvel, com ventilação frontal dedicada.</li><li><strong>Dual Zone:</strong> duas zonas de temperatura independentes dentro da mesma adega.</li><li><strong>Tecnologia Low-E:</strong> vidro com baixa emissividade — melhora o isolamento térmico e bloqueia raios UV.</li><li><strong>Energy Cut Off Memory:</strong> memória que retoma a temperatura programada após uma queda de energia.</li><li><strong>Filtro de Carvão Ativado:</strong> filtro que mantém a qualidade do ar interno, evitando odores — trocar a cada 6-12 meses.</li><li><strong>Classe Climática (SN/N/ST/T):</strong> faixa de temperatura ambiente recomendada para o produto funcionar dentro do padrão (SN: 10-32°C · N: 16-32°C · ST: 18-38°C · T: 18-43°C).</li><li><strong>R600a (Isobutano):</strong> gás refrigerante natural, mais eficiente e ecológico, porém inflamável — exige cuidado no transporte.</li><li><strong>Sudação:</strong> formação de gotículas na parte externa da adega em ambientes muito úmidos (acima de 70% de umidade) — fenômeno normal, não é defeito.</li></ul>"},

{id:"adegas_p_faq", kind:"chapter", categoryId:"adegas", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Adegas · Capítulo 24 de 24 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Qual a diferença entre os modelos freestanding e built-in?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Freestanding (14 e 34 garrafas) é de instalação livre, pode ser realocada. Built-in (26 e 46 garrafas) é embutida em bancada/móvel, com ventilação 100% frontal.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso guardar alimentos na adega?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. As adegas Invita são exclusivas para bebidas — não devem ser usadas para alimentos perecíveis.</div></div></div><div class='faq-item'><div class='faq-question'><span>Como as garrafas devem ser posicionadas?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sempre deitadas, com espaço entre elas, sem cobrir as saídas de ar. A capacidade máxima considera garrafa padrão Bordeaux 750ml.</div></div></div><div class='faq-item'><div class='faq-question'><span>Os modelos 26 e 46 garrafas têm app de controle?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, via o aplicativo Elettromec Connect (Bluetooth + Wi-Fi) — permite ver e ajustar as duas zonas de temperatura pelo celular.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quanto tempo esperar para ligar a adega após a instalação?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Pelo menos 2 horas, para o fluido refrigerante se estabilizar após o transporte/instalação.</div></div></div><div class='faq-item'><div class='faq-question'><span>A porta das adegas built-in pode ser invertida (esquerda/direita)?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, nos modelos 26 e 46 garrafas a porta é reversível, conforme descrito no manual — recomenda-se que a troca seja feita por técnico autorizado.</div></div></div><div class='faq-item'><div class='faq-question'><span>Formação de gotículas do lado de fora da adega é defeito?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não, é o fenômeno de sudação — normal em ambientes com umidade relativa acima de 70%. Basta secar com pano seco e, se possível, ventilar o ambiente.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso reduzir a folga traseira de 50mm nos modelos built-in?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Apenas em projetos de marcenaria com ventilação frontal plena e fundo técnico recuado ou aberto comprovados — e a responsabilidade por essa decisão é do profissional executor da obra.</div></div></div><div class='faq-item'><div class='faq-question'><span>Com que frequência trocar o filtro de carvão ativado?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>A cada 6 a 12 meses, ou conforme orientação do fabricante — disponível nos modelos que o acompanham.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia das adegas?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"beercenters_p_85_manutencao", kind:"chapter", categoryId:"beercenters", navTitle:"Beer Center 85L Freestanding · Manutenção", icon:"🍺", title:"Manutenção e Limpeza", kicker:"Beer Centers · Capítulo 5 de 13 · Manutenção", html:"<p>Limpe o interior e as prateleiras com pano macio e água morna; nunca use produtos abrasivos. Sempre desligue o produto da tomada antes de qualquer limpeza. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção</div><div class='media-body'><audio class='custom-audio' id='bc85Aud3' controls preload='none' src='/media/beercenters/beercenters_p_85_manutencao__audio-manutencao.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='bc85Aud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='bc85Aud3' data-rate='1'>1x</button><button class='speed-btn' data-target='bc85Aud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='bc85Aud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='bc85Aud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/beercenters/beercenters_p_85_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Beer Center Invita 85L' loading='lazy'></div>", quiz:{"question":"Qual destas é uma prática correta de manutenção do Beer Center Invita 85L?","options":["Usar esponja de aço para remover manchas","Desligar da tomada antes de iniciar a limpeza","Lavar o interior com mangueira de água","Manter a porta aberta durante a limpeza sem desligar"],"correct":1,"explain":"Por segurança elétrica, o produto deve sempre ser desligado da tomada antes de qualquer limpeza."}},

{id:"beercenters_p_builtin_resumo", kind:"chapter", categoryId:"beercenters", navTitle:"Beer Center Built-in 86L/135L · Resumo", icon:"🍺", title:"Beer Center Built-in 86L/135L", kicker:"Beer Centers · Capítulo 6 de 13 · Visão Geral", html:"<p>A linha <strong>Built-in</strong> de Beer Center Invita é embutida, com ventilação frontal, porta de vidro duplo com <strong>Heating Glass</strong> (reduz condensação) e compressor <strong>inverter</strong>. Disponível em duas capacidades: 86 litros (até 88 latas) e 135 litros (até 178 latas).</p>"},

{id:"beercenters_p_builtin_manutencao", kind:"chapter", categoryId:"beercenters", navTitle:"Beer Center Built-in 86L/135L · Manutenção", icon:"🍺", title:"Manutenção e Limpeza", kicker:"Beer Centers · Capítulo 10 de 13 · Manutenção", html:"<p>Limpe o interior e as prateleiras com pano macio e água morna; nunca use produtos abrasivos. Sempre desligue o produto da tomada antes de qualquer limpeza. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção</div><div class='media-body'><audio class='custom-audio' id='bcbiAud4' controls preload='none' src='/media/beercenters/beercenters_p_builtin_manutencao__audio-manutencao.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='bcbiAud4' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='bcbiAud4' data-rate='1'>1x</button><button class='speed-btn' data-target='bcbiAud4' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='bcbiAud4' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='bcbiAud4' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/beercenters/beercenters_p_builtin_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Beer Center Invita Built-in' loading='lazy'></div>", quiz:{"question":"Antes de limpar o Beer Center Built-in, o que deve ser feito primeiro?","options":["Aumentar a temperatura ao máximo","Desligar o produto da tomada","Remover o compressor","Encher totalmente com latas"],"correct":1,"explain":"Por segurança, sempre desligue o produto da tomada antes de iniciar qualquer procedimento de limpeza."}},

{id:"beercenters_p_problemas", kind:"chapter", categoryId:"beercenters", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Beer Centers · Capítulo 11 de 13 · Diagnóstico Rápido", html:"<p>Problemas comuns, válidos para toda a linha de Beer Centers Invita (freestanding e built-in):</p><div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Não liga</td><td>Disjuntor desligado ou cabo desconectado</td><td>Verifique o disjuntor e a conexão do cabo</td></tr><tr><td>Não liga após queda de energia</td><td>Proteção do sistema</td><td>Aguarde 5 minutos antes de religar</td></tr><tr><td>Refrigeração insuficiente</td><td>Temp. ambiente alta, porta aberta com frequência, distâncias mínimas não respeitadas</td><td>Ajuste a temperatura, feche bem a porta, revise o espaçamento de instalação</td></tr><tr><td>Condensação/embaçamento no vidro</td><td>Umidade elevada, redutor de umidade insuficiente para o ambiente</td><td>Ventile o ambiente; nos modelos built-in, o Heating Glass já atenua o efeito</td></tr><tr><td>Vibrações</td><td>Produto desnivelado</td><td>Ajuste os pés para apoio total no piso</td></tr><tr><td>Porta não fecha corretamente</td><td>Produto desnivelado, sujeira na vedação</td><td>Nivele os pés e limpe a vedação com pano macio</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>Anote as informações da etiqueta de especificações (parte traseira do produto) antes de contatar o SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"beercenters_p_glossario", kind:"chapter", categoryId:"beercenters", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Beer Centers · Capítulo 12 de 13 · Termos Essenciais", html:"<ul class='styled'><li><strong>Freestanding:</strong> instalação livre/portátil — o produto pode ser realocado, não é embutido.</li><li><strong>Built-in:</strong> instalação embutida em bancada/móvel, com ventilação frontal dedicada.</li><li><strong>Auto Defrost:</strong> sistema que impede a produção de gelo no interior do produto.</li><li><strong>Energy Cut Off Memory (ECM):</strong> memória que retoma a temperatura programada após uma queda de energia.</li><li><strong>Heating Glass:</strong> resistência na porta que reduz a condensação/sudação do vidro.</li><li><strong>Tecnologia Low-E:</strong> vidro de baixa emissividade — melhora o isolamento térmico.</li><li><strong>Compressor Inverter:</strong> compressor de velocidade variável, mais eficiente e silencioso que o convencional.</li><li><strong>Classe Climática (ST/T):</strong> faixa de temperatura ambiente recomendada para o produto operar corretamente.</li></ul>"},

{id:"beercenters_p_faq", kind:"chapter", categoryId:"beercenters", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Beer Centers · Capítulo 13 de 13 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Qual a diferença entre os modelos freestanding e built-in?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Freestanding (85L) é de instalação livre, pode ser realocado. Built-in (86L e 135L) é embutido em bancada/móvel, com ventilação 100% frontal.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quantas latas cabem em cada modelo?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>85L: até 70 latas. 86L Built-in: até 88 latas. 135L Built-in: até 178 latas.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso guardar outras bebidas além de cerveja?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, a faixa de temperatura ampla (até -10°C no modelo 135L) permite guardar diversos tipos de bebidas geladas, não só cerveja.</div></div></div><div class='faq-item'><div class='faq-question'><span>O que é o Heating Glass e para que serve?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>É uma resistência integrada ao vidro duplo da porta dos modelos built-in, que reduz a condensação e melhora a eficiência térmica.</div></div></div><div class='faq-item'><div class='faq-question'><span>As prateleiras são ajustáveis?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Nos modelos built-in (86L e 135L), sim — as prateleiras em metal com frente em madeira podem ser reposicionadas para diferentes formatos de embalagem.</div></div></div><div class='faq-item'><div class='faq-question'><span>Se faltar energia, preciso reprogramar a temperatura?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. Todos os modelos têm a função Energy Cut Off Memory (ECM), que memoriza a última temperatura programada.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia dos Beer Centers?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"coifas_p_ilha35_manutencao", kind:"chapter", categoryId:"coifas", navTitle:"Coifa Ilha 35cm · Manutenção", icon:"🌬️", title:"Manutenção e Limpeza", kicker:"Coifas · Capítulo 5 de 23 · Manutenção", html:"<p>Limpe os filtros metálicos/baffle regularmente com água e detergente neutro; substitua o filtro de carvão ativado quando saturado (não é lavável). Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/coifas/coifas_p_ilha35_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção da Coifa Ilha Invita 35cm' loading='lazy'></div>", quiz:{"question":"Com que frequência recomenda-se limpar os filtros metálicos da Coifa Ilha 35cm?","options":["Diariamente","Mensalmente, em uso regular","Uma vez por ano","Nunca precisam ser limpos"],"correct":1,"explain":"Recomenda-se limpeza mensal em uso regular — os filtros de alumínio são removíveis e podem ser lavados."}},

{id:"coifas_p_black_manutencao", kind:"chapter", categoryId:"coifas", navTitle:"Coifa Parede Black 90cm · Manutenção", icon:"🌬️", title:"Manutenção e Limpeza", kicker:"Coifas · Capítulo 20 de 23 · Manutenção", html:"<p>Limpe os filtros metálicos/baffle regularmente com água e detergente neutro; substitua o filtro de carvão ativado quando saturado (não é lavável). Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza</div><div class='media-body'><audio class='custom-audio' id='cfblAud3' controls preload='none' src='/media/coifas/coifas_p_black_manutencao__audio-manutencao-e-limpeza.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='cfblAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='cfblAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='cfblAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='cfblAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='cfblAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/coifas/coifas_p_black_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção da Coifa Invita Black Parede 90cm' loading='lazy'></div>", quiz:{"question":"Assim como a versão Inox, a Coifa Parede Black usa filtro do tipo:","options":["Papel descartável","Baffle removível e higienizável","Apenas carvão ativado","Não usa filtro"],"correct":1,"explain":"A Coifa Parede Black usa filtro baffle, removível e higienizável, com retenção eficiente de gordura."}},

{id:"coifas_p_problemas", kind:"chapter", categoryId:"coifas", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Coifas · Capítulo 21 de 23 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Sucção fraca</td><td>Filtros de gordura saturados</td><td>Limpe ou substitua os filtros metálicos/baffle</td></tr><tr><td>Cheiro persistente no modo depuração</td><td>Filtro de carvão ativado saturado</td><td>Substitua o filtro de carvão (não é lavável)</td></tr><tr><td>Ruído excessivo</td><td>Velocidade muito alta, filtros sujos, dutos obstruídos</td><td>Reduza a velocidade e limpe os filtros; verifique o duto de saída</td></tr><tr><td>Não liga</td><td>Disjuntor desligado ou instalação elétrica incorreta</td><td>Verifique o disjuntor e a conexão elétrica</td></tr><tr><td>Iluminação não acende</td><td>LED com defeito</td><td>Contate a assistência técnica autorizada — LED não é item de reposição pelo usuário</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"coifas_p_glossario", kind:"chapter", categoryId:"coifas", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Coifas · Capítulo 22 de 23 · Termos Essenciais", html:"<ul class='styled'><li><strong>Exaustão:</strong> modo que expele o ar filtrado para fora do ambiente, via duto.</li><li><strong>Depuração:</strong> modo que recircula o ar de volta ao ambiente, após filtragem pelo carvão ativado — usado quando não há duto disponível.</li><li><strong>Vazão (m³/h):</strong> volume de ar que a coifa é capaz de mover por hora — quanto maior, mais potente a sucção.</li><li><strong>Filtro Baffle:</strong> filtro metálico de lâminas que retém gordura por impacto, sem precisar de troca — apenas lavagem periódica.</li><li><strong>Filtro de Carvão Ativado:</strong> filtro consumível (não lavável) usado no modo depuração para neutralizar odores.</li><li><strong>Aspiração Central vs. Perimetral:</strong> central capta pelo centro do painel; perimetral capta pelas bordas — geralmente mais silenciosa.</li><li><strong>Bandeja Coletora:</strong> peça que recolhe resíduos de gordura líquida em preparos intensos, facilitando a limpeza.</li></ul>"},

{id:"coifas_p_faq", kind:"chapter", categoryId:"coifas", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Coifas · Capítulo 23 de 23 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Qual a diferença entre os modos exaustão e depuração?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Exaustão expele o ar filtrado para fora via duto; depuração recircula o ar de volta ao ambiente, após passar pelo filtro de carvão ativado — útil quando não há saída de duto disponível.</div></div></div><div class='faq-item'><div class='faq-question'><span>Com que frequência devo limpar os filtros metálicos?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Recomenda-se limpeza mensal em uso regular — filtros de alumínio e baffle são removíveis e podem ser lavados.</div></div></div><div class='faq-item'><div class='faq-question'><span>O filtro de carvão ativado é lavável?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. É um item consumível — precisa ser substituído periodicamente, pois perde a capacidade de neutralizar odores com o uso.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso instalar a coifa built-in eu mesmo?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não é recomendado. A instalação deve ser feita por profissional autorizado — instalações incorretas podem comprometer a garantia e a segurança.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual coifa tem maior vazão de ar?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>As coifas de 90cm (Parede, Built-in e Parede Black) têm vazão de 1.200 m³/h, superior aos 800 m³/h da Coifa Ilha 35cm.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia das Coifas Invita?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"cooktops_p_gas70_resumo", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Gás 70cm · Resumo", icon:"🍳", title:"Cooktop Gás 70cm", kicker:"Cooktops · Capítulo 6 de 18 · Visão Geral", html:"<p>O <strong>Cooktop Invita a Gás 70cm</strong> é a versão compacta da linha, mantendo os mesmos 5 queimadores Defendi e a mesma potência total de 11,6kW — ideal para cozinhas com espaço mais reduzido.</p>"},

{id:"cooktops_p_gas70_instalacao", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Gás 70cm · Instalação", icon:"🍳", title:"Instalação e Segurança", kicker:"Cooktops · Capítulo 9 de 18 · Instalação", html:"<h2 class='section-title'>🎧 Áudio · Instalação e Segurança</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Segurança e Instalação</div><div class='media-body'><audio class='custom-audio' id='ckg70Aud2' controls preload='none' src='/media/cooktops/cooktops_p_gas70_instalacao__audio-seguranca-e-instalacao.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='ckg70Aud2' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='ckg70Aud2' data-rate='1'>1x</button><button class='speed-btn' data-target='ckg70Aud2' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='ckg70Aud2' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='ckg70Aud2' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Instalação e Segurança</div><img src='/media/cooktops/cooktops_p_gas70_instalacao__infografico-instalacao-e-seguranca.jpg' alt='Infográfico com o guia de instalação do Cooktop Invita Gás 70cm' loading='lazy'></div>", quiz:{"question":"O que a Válvula de Segurança do cooktop a gás faz?","options":["Aumenta a potência da chama","Corta o fornecimento de gás caso a chama apague","Liga o exaustor automaticamente","Trava o cooktop contra crianças"],"correct":1,"explain":"A válvula de segurança interrompe automaticamente o fornecimento de gás caso a chama se apague, evitando vazamentos — um item essencial de segurança em todos os queimadores."}},

{id:"cooktops_p_gas70_manutencao", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Gás 70cm · Manutenção", icon:"🍳", title:"Manutenção e Limpeza", kicker:"Cooktops · Capítulo 10 de 18 · Manutenção", html:"<p>Limpe a superfície com pano macio e produtos próprios para inox/vidro; nunca use esponjas ou produtos abrasivos, que podem riscar o acabamento. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza</div><div class='media-body'><audio class='custom-audio' id='ckg70Aud3' controls preload='none' src='/media/cooktops/cooktops_p_gas70_manutencao__audio-manutencao-e-limpeza.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='ckg70Aud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='ckg70Aud3' data-rate='1'>1x</button><button class='speed-btn' data-target='ckg70Aud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='ckg70Aud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='ckg70Aud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/cooktops/cooktops_p_gas70_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Cooktop Invita Gás 70cm' loading='lazy'></div>", quiz:{"question":"Qual cuidado de limpeza deve-se ter com o Cooktop a Gás 70cm?","options":["Usar palha de aço para remover gordura","Evitar produtos abrasivos e limpar com pano macio","Deixar a sujeira acumular entre usos","Usar água em jato de alta pressão"],"correct":1,"explain":"Assim como o modelo de 90cm, deve-se evitar produtos e esponjas abrasivas na limpeza da superfície."}},

{id:"cooktops_p_inducao_resumo", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Indução 60/90cm · Resumo", icon:"🍳", title:"Cooktop Indução 60/90cm", kicker:"Cooktops · Capítulo 11 de 18 · Visão Geral", html:"<p>Os <strong>Cooktops de Indução Invita</strong> usam tecnologia eletromagnética: o calor é gerado diretamente no utensílio por vibração magnética, com mais eficiência energética e segurança (a superfície não esquenta diretamente). Disponíveis em 60cm (4 zonas) e 90cm (6 zonas).</p>"},

{id:"cooktops_p_inducao_diferenciais", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Indução 60/90cm · Diferenciais", icon:"🍳", title:"Diferenciais Comerciais", kicker:"Cooktops · Capítulo 12 de 18 · Diferenciais", html:"<p>Conheça os principais diferenciais do <strong>Cooktop Indução 60/90cm</strong> — a base para qualquer argumento de venda ou objeção de cliente.</p><div class='feature-grid'><div class='feature-card'><span class='f-icon'>⚡</span><h4>Indução Eletromagnética</h4><p>Gera calor diretamente no utensílio, com eficiência energética e segurança.</p></div><div class='feature-card'><span class='f-icon'>📱</span><h4>Painel Touch com Slider</h4><p>Comandos touch com seletor de nível de potência tipo slider deslizante.</p></div><div class='feature-card'><span class='f-icon'>🚀</span><h4>Função Boost</h4><p>Potência máxima por 5 minutos, para aquecimento e fervura mais rápidos.</p></div><div class='feature-card'><span class='f-icon'>🔒</span><h4>Bloqueio Infantil (Child Lock)</h4><p>Trava o painel para evitar acionamento acidental por crianças.</p></div><div class='feature-card'><span class='f-icon'>🌡️</span><h4>Indicador de Calor Residual (H)</h4><p>Alerta visual enquanto a superfície ainda está quente, mesmo desligada.</p></div><div class='feature-card'><span class='f-icon'>🔲</span><h4>Zona Flexível</h4><p>Permite combinar duas zonas em uma área maior, para panelas grandes ou fôrmas.</p></div></div><h2 class='section-title'>🎬 Vídeo · Diferenciais</h2><div class='media-block'><div class='media-label'>▶️ Vídeo · Diferenciais Cooktops Indução 60/90cm</div><video controls preload='metadata'><source src='/media/cooktops/cooktops_p_inducao_diferenciais__video-diferenciais-cooktops-inducao-60-9.mp4' type='video/mp4'></video></div><h2 class='section-title'>🎧 Áudio · Diferenciais</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Diferenciais</div><div class='media-body'><audio class='custom-audio' id='ckiAud1' controls preload='none' src='/media/cooktops/cooktops_p_inducao_diferenciais__audio-diferenciais.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='ckiAud1' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='ckiAud1' data-rate='1'>1x</button><button class='speed-btn' data-target='ckiAud1' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='ckiAud1' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='ckiAud1' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Diferenciais</div><img src='/media/cooktops/cooktops_p_inducao_diferenciais__infografico-diferenciais.jpg' alt='Infográfico com os diferenciais dos Cooktops Invita de Indução' loading='lazy'></div>", quiz:{"question":"Que tipo de panela funciona nos Cooktops de Indução Invita?","options":["Qualquer panela, inclusive vidro e cerâmica","Apenas panelas com fundo de material ferroso (que atraem ímã)","Apenas panelas de alumínio","Apenas panelas antiaderentes"],"correct":1,"explain":"A indução eletromagnética só funciona com utensílios de fundo ferroso (que atraem ímã) e fundo plano — panelas de vidro, cerâmica pura ou alumínio comum não esquentam nesse tipo de cooktop."}},

{id:"cooktops_p_inducao_specs", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Indução 60/90cm · Especificações", icon:"🍳", title:"Especificações Técnicas", kicker:"Cooktops · Capítulo 13 de 18 · Ficha Técnica", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Característica</th><th>60 cm</th><th>90 cm</th></tr><tr><td>Código</td><td>i-CKI-4Q-60-CI-2ATA</td><td>i-CKI-6Q-90-CI-2ATA</td></tr><tr><td>Zonas de cocção</td><td>4</td><td>6</td></tr><tr><td>Largura do produto</td><td>590 mm</td><td>900 mm</td></tr><tr><td>Largura do recorte (nicho)</td><td>560 mm</td><td>860 mm</td></tr><tr><td>Potência total</td><td>7.200 W</td><td>Superior (6 zonas)</td></tr><tr><td>Peso líquido</td><td>8 kg</td><td>—</td></tr><tr><td>Tensão / Frequência</td><td colspan='2'>220 V / 60 Hz</td></tr><tr><td>Funções</td><td colspan='2'>Boost · Timer (até 99min) · Keep Warm · Pausa · Zona Flexível</td></tr><tr><td>Utensílios compatíveis</td><td colspan='2'>Fundo ferroso (atrai ímã) e fundo plano</td></tr></table></div><div class='callout info'><span class='c-icon'>ℹ️</span><p>Informações técnicas podem sofrer alterações sem aviso prévio. Em caso de dúvida, consulte a versão online do Manual do Consumidor em invitacasa.com.br.</p></div>", quiz:{"question":"Quantas zonas de cocção tem o Cooktop de Indução de 90cm?","options":["4","5","6","8"],"correct":2,"explain":"O modelo de 90cm tem 6 zonas de cocção, contra 4 zonas do modelo de 60cm."}},

{id:"cooktops_p_inducao_instalacao", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Indução 60/90cm · Instalação", icon:"🍳", title:"Instalação e Segurança", kicker:"Cooktops · Capítulo 14 de 18 · Instalação", html:"<h2 class='section-title'>⚠️ Códigos de Erro</h2><table class='spec-table'><tr><th>Código</th><th>Significado</th></tr><tr><td>E1</td><td>Ausência de panela ou utensílio inadequado</td></tr><tr><td>E2 / E3</td><td>Tensão da rede elétrica fora da faixa permitida</td></tr><tr><td>H</td><td>Alerta de alta temperatura na superfície (calor residual)</td></tr></table><div class='callout warn'><span class='c-icon'>🧽</span><p>Limpe resíduos açucarados imediatamente com raspador (ângulo de 30°), mesmo com a superfície quente — eles podem danificar permanentemente o vidro se esfriarem. Nunca use equipamentos a vapor ou palha de aço.</p></div><h2 class='section-title'>🎧 Áudio · Instalação e Segurança</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Instalação e Segurança</div><div class='media-body'><audio class='custom-audio' id='ckiAud2' controls preload='none' src='/media/cooktops/cooktops_p_inducao_instalacao__audio-instalacao-e-seguranca.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='ckiAud2' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='ckiAud2' data-rate='1'>1x</button><button class='speed-btn' data-target='ckiAud2' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='ckiAud2' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='ckiAud2' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Instalação e Segurança</div><img src='/media/cooktops/cooktops_p_inducao_instalacao__infografico-instalacao-e-seguranca.jpg' alt='Infográfico com o guia de instalação dos Cooktops Invita de Indução' loading='lazy'></div>", quiz:{"question":"O que significa o código de erro 'E1' no Cooktop de Indução Invita?","options":["Tensão da rede fora da faixa permitida","Ausência de panela ou utensílio inadequado","Alerta de superfície muito quente","Defeito de fábrica — não é possível resolver"],"correct":1,"explain":"O código E1 indica ausência de panela ou uso de utensílio inadequado (sem fundo ferroso). E2/E3 indicam tensão fora da faixa, e H indica calor residual."}},

{id:"cooktops_p_inducao_manutencao", kind:"chapter", categoryId:"cooktops", navTitle:"Cooktop Indução 60/90cm · Manutenção", icon:"🍳", title:"Manutenção e Limpeza", kicker:"Cooktops · Capítulo 15 de 18 · Manutenção", html:"<p>Limpe a superfície com pano macio e produtos próprios para inox/vidro; nunca use esponjas ou produtos abrasivos, que podem riscar o acabamento. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Limpeza e Manutenção</div><div class='media-body'><audio class='custom-audio' id='ckiAud3' controls preload='none' src='/media/cooktops/cooktops_p_inducao_manutencao__audio-limpeza-e-manutencao.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='ckiAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='ckiAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='ckiAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='ckiAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='ckiAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/cooktops/cooktops_p_inducao_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção dos Cooktops Invita de Indução' loading='lazy'></div>", quiz:{"question":"Como remover resíduos açucarados grudados na superfície do Cooktop de Indução?","options":["Deixar esfriar por 24h antes de limpar","Usar um raspador em ângulo de 30°, mesmo com a superfície ainda quente","Usar palha de aço","Usar limpador a vapor"],"correct":1,"explain":"Resíduos açucarados devem ser removidos imediatamente com raspador em ângulo de 30°, pois podem danificar o vidro se esfriarem. Nunca use vapor ou palha de aço."}},

{id:"cooktops_p_problemas", kind:"chapter", categoryId:"cooktops", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Cooktops · Capítulo 16 de 18 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Queimador a gás não acende</td><td>Manípulo não pressionado corretamente, sujeira no acendedor</td><td>Pressione bem o manípulo até o clique do acendimento; limpe a região da centelha</td></tr><tr><td>Chama apaga sozinha</td><td>Válvula de segurança ativada por corrente de ar</td><td>Reacenda protegendo a chama de correntes de ar</td></tr><tr><td>Indução mostra erro E1</td><td>Ausência de panela ou utensílio incompatível (não ferroso)</td><td>Use panela com fundo ferroso e plano, compatível com indução</td></tr><tr><td>Indução mostra erro E2/E3</td><td>Tensão da rede elétrica fora da faixa</td><td>Verifique a instalação elétrica com um eletricista</td></tr><tr><td>Indicador \"H\" aceso</td><td>Superfície ainda quente (calor residual)</td><td>Normal — aguarde esfriar antes de tocar ou limpar</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"cooktops_p_glossario", kind:"chapter", categoryId:"cooktops", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Cooktops · Capítulo 17 de 18 · Termos Essenciais", html:"<ul class='styled'><li><strong>Dual Flame / Tripla Chama:</strong> queimador a gás de maior potência (4kW), com múltiplos anéis de chama para melhor distribuição de calor.</li><li><strong>Trempe:</strong> a grade metálica sobre a qual as panelas são apoiadas, no cooktop a gás.</li><li><strong>Válvula de Segurança:</strong> dispositivo que corta o fornecimento de gás automaticamente se a chama apagar.</li><li><strong>Indução Eletromagnética:</strong> tecnologia que gera calor diretamente no fundo do utensílio via campo magnético, sem aquecer a superfície de vidro diretamente.</li><li><strong>Boost:</strong> função que eleva a zona de indução à potência máxima por tempo limitado (5 min).</li><li><strong>Zona Flexível:</strong> combina duas zonas de indução adjacentes em uma única área maior.</li><li><strong>Child Lock:</strong> bloqueio de segurança que trava o painel touch contra acionamento acidental.</li></ul>"},

{id:"cooktops_p_faq", kind:"chapter", categoryId:"cooktops", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Cooktops · Capítulo 18 de 18 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Qual a diferença entre os cooktops a gás de 70cm e 90cm?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Ambos têm 5 queimadores e a mesma potência total (11,6kW) — a diferença é o espaçamento entre queimadores, proporcional à largura maior do modelo 90cm.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso usar qualquer panela no cooktop de indução?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. Apenas panelas com fundo de material ferroso (que gruda em ímã) e fundo plano funcionam com indução.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual a diferença entre os cooktops de indução 60cm e 90cm?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O 60cm tem 4 zonas de cocção; o 90cm tem 6 zonas, com potência total superior — mais espaço para cozinhar vários pratos simultaneamente.</div></div></div><div class='faq-item'><div class='faq-question'><span>O vidro do cooktop de indução esquenta?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Apenas indiretamente, pelo calor transferido pela panela — a superfície não é aquecida diretamente como em um cooktop elétrico convencional, mas ainda pode ficar quente ao toque (indicador \"H\").</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso instalar o cooktop eu mesmo?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não é recomendado. A instalação (elétrica ou de gás) deve ser feita por profissional autorizado, respeitando as normas ABNT NBR 5410 (elétrica) e de instalação de gás.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia dos Cooktops Invita?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"fogaopiso_p_produto_manutencao", kind:"chapter", categoryId:"fogaopiso", navTitle:"Fogão de Piso 75cm e 90cm · Manutenção", icon:"🔥", title:"Manutenção e Limpeza", kicker:"Fogão Piso · Capítulo 5 de 8 · Manutenção", html:"<p>Limpe as grades e a superfície com pano macio e detergente neutro; nunca use produtos abrasivos que possam danificar o acabamento. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza</div><div class='media-body'><audio class='custom-audio' id='fgAud3' controls preload='none' src='/media/fogaopiso/fogaopiso_p_produto_manutencao__audio-manutencao-e-limpeza.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='fgAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='fgAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='fgAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='fgAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='fgAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/fogaopiso/fogaopiso_p_produto_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Fogão de Piso Invita' loading='lazy'></div>", quiz:{"question":"O que fazer se o timer mecânico do forno não avisar corretamente ao final do preparo?","options":["Trocar o fogão inteiro","Reprogramar girando o timer até a marcação desejada","Ignorar, não há solução","Desligar o disjuntor permanentemente"],"correct":1,"explain":"Segundo a solução de problemas, basta reprogramar o timer mecânico girando-o até a marcação de tempo desejada."}},

{id:"fogaopiso_p_problemas", kind:"chapter", categoryId:"fogaopiso", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Fogão Piso · Capítulo 6 de 8 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Queimador não acende</td><td>Manípulo não pressionado corretamente, umidade</td><td>Pressione bem até o clique do acendimento superautomático</td></tr><tr><td>Chama apaga sozinha</td><td>Válvula de segurança ativada por corrente de ar</td><td>Reacenda protegendo a chama de correntes de ar</td></tr><tr><td>Forno não aquece igual em todas as prateleiras</td><td>Motor de convecção não acionado</td><td>Verifique se a função selecionada usa o motor de convecção</td></tr><tr><td>Timer não avisa ao final</td><td>Timer mecânico não foi programado corretamente</td><td>Reprograme girando o timer até a marcação desejada</td></tr><tr><td>Porta do forno difícil de limpar</td><td>Vidro triplo não removido para limpeza</td><td>Remova a porta conforme o manual para acessar entre os vidros</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"fogaopiso_p_glossario", kind:"chapter", categoryId:"fogaopiso", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Fogão Piso · Capítulo 7 de 8 · Termos Essenciais", html:"<ul class='styled'><li><strong>Dual Flame:</strong> queimador com dois anéis de chama, entregando maior potência (4,0kW) e melhor distribuição de calor.</li><li><strong>Motor de Convecção:</strong> ventilador interno do forno que distribui o calor de forma homogênea, permitindo assar em múltiplas prateleiras ao mesmo tempo.</li><li><strong>Multifunção:</strong> forno com múltiplos modos de aquecimento (resistência superior, inferior, convecção, grill, etc.) — no caso deste fogão, 8 funções.</li><li><strong>Suporte Panela Wok:</strong> acessório que estabiliza panelas de fundo arredondado sobre o queimador.</li><li><strong>Timer Mecânico:</strong> temporizador de corda (não digital) que soa ao final do tempo programado.</li><li><strong>GLP / GN:</strong> Gás Liquefeito de Petróleo (botijão) e Gás Natural (encanado) — o fogão é compatível com ambos, mediante ajuste do bico injetor.</li></ul>"},

{id:"fogaopiso_p_faq", kind:"chapter", categoryId:"fogaopiso", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Fogão Piso · Capítulo 8 de 8 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>O forno é a gás ou elétrico?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O forno é elétrico em ambos os tamanhos — apenas a mesa (queimadores) funciona a gás.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual a diferença entre o modelo 75cm e o 90cm?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Além da largura, o forno de 90cm tem capacidade ligeiramente maior (102L vs 92L) e a disposição dos queimadores rápidos/semirrápidos é diferente.</div></div></div><div class='faq-item'><div class='faq-question'><span>O fogão funciona com gás encanado (GN)?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, é compatível com GLP (botijão) e GN (encanado) — a conversão exige ajuste do bico injetor, feito por técnico autorizado.</div></div></div><div class='faq-item'><div class='faq-question'><span>A porta do forno é removível?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, a porta com vidro triplo é removível, facilitando a limpeza e manutenção do equipamento.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso usar panela Wok neste fogão?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, o fogão acompanha suporte específico para panela Wok, garantindo estabilidade e segurança.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia do Fogão de Piso Invita?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"fornoairfryer_p_problemas", kind:"chapter", categoryId:"fornoairfryer", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Forno Bancada Air Fryer · Capítulo 6 de 8 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Alimento não fica crocante</td><td>Excesso de alimento no cesto, obstruindo a circulação de ar</td><td>Não sobrecarregue o cesto; prepare em porções menores</td></tr><tr><td>Não liga</td><td>Tomada incorreta ou cabo desconectado</td><td>Verifique a conexão elétrica</td></tr><tr><td>Fumaça durante o uso</td><td>Resíduos de gordura de usos anteriores</td><td>Limpe a cavidade interna e os acessórios regularmente</td></tr><tr><td>Cocção desigual</td><td>Alimentos empilhados ou cesto mal posicionado</td><td>Distribua os alimentos em camada única quando possível</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"fornoairfryer_p_glossario", kind:"chapter", categoryId:"fornoairfryer", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Forno Bancada Air Fryer · Capítulo 7 de 8 · Termos Essenciais", html:"<ul class='styled'><li><strong>Air Fryer:</strong> tecnologia que frita alimentos por convecção de ar quente, sem necessidade de imersão em óleo.</li><li><strong>Cesto Fryer:</strong> acessório giratório ou fixo que acondiciona o alimento durante a cocção Air Fryer.</li><li><strong>Rotisseria:</strong> função com espeto giratório, indicada para assar aves e carnes de forma uniforme.</li><li><strong>Desidratar:</strong> função de baixa temperatura prolongada, usada para secar frutas, legumes ou carnes.</li><li><strong>Convecção:</strong> circulação forçada de ar quente dentro da cavidade do forno, para cocção mais uniforme.</li></ul>"},

{id:"fornomultifuncao_p_produto_manutencao", kind:"chapter", categoryId:"fornomultifuncao", navTitle:"Forno Multifunção 60cm · Manutenção", icon:"🍞", title:"Manutenção e Limpeza", kicker:"Forno Multifunção · Capítulo 5 de 8 · Manutenção", html:"<p>Limpe as partes internas e acessórios com pano macio e água morna; nunca use produtos abrasivos ou imerja o produto em água. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza</div><div class='media-body'><audio class='custom-audio' id='fmAud3' controls preload='none' src='/media/fornomultifuncao/fornomultifuncao_p_produto_manutencao__audio-manutencao-e-limpeza.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='fmAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='fmAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='fmAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='fmAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='fmAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/fornomultifuncao/fornomultifuncao_p_produto_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Forno Multifunção Invita' loading='lazy'></div>", quiz:{"question":"O que fazer se a porta do Forno Multifunção não vedar bem?","options":["Ignorar, não afeta o uso","Limpar a vedação; se danificada, contatar a assistência técnica","Substituir a porta inteira sozinho","Aumentar a temperatura para compensar"],"correct":1,"explain":"Vedação suja pode ser limpa pelo usuário; se estiver danificada, é necessário contatar a assistência técnica."}},

{id:"fornomultifuncao_p_problemas", kind:"chapter", categoryId:"fornomultifuncao", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Forno Multifunção · Capítulo 6 de 8 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Não liga</td><td>Trava de segurança ativada ou disjuntor desligado</td><td>Verifique a trava e o disjuntor</td></tr><tr><td>Cocção desigual</td><td>Função de aquecimento incorreta para o tipo de receita</td><td>Use a função de convecção para cocção mais uniforme</td></tr><tr><td>Timer não conta corretamente</td><td>Modo do timer configurado incorretamente</td><td>Revise se está no modo Timer Operacional, Sonoro ou Programação Futura</td></tr><tr><td>Porta não veda bem</td><td>Borracha de vedação suja ou danificada</td><td>Limpe a vedação; se danificada, contate a assistência técnica</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"fornomultifuncao_p_glossario", kind:"chapter", categoryId:"fornomultifuncao", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Forno Multifunção · Capítulo 7 de 8 · Termos Essenciais", html:"<ul class='styled'><li><strong>Convecção:</strong> circulação forçada de ar quente dentro do forno, para cocção mais uniforme em múltiplas prateleiras.</li><li><strong>Grill:</strong> resistência superior de alta potência, usada para gratinar ou dourar a parte de cima dos alimentos.</li><li><strong>Timer Operacional:</strong> conta o tempo de cocção e desliga o forno automaticamente ao final.</li><li><strong>Timer Sonoro:</strong> apenas emite um alarme ao final do tempo, sem desligar o forno.</li><li><strong>Programação Futura:</strong> permite agendar o horário de início da cocção.</li></ul>"},

{id:"fornomultifuncao_p_faq", kind:"chapter", categoryId:"fornomultifuncao", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Forno Multifunção · Capítulo 8 de 8 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>O forno é a gás ou elétrico?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>É totalmente elétrico, com comando eletrônico.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual a diferença entre Timer Operacional e Timer Sonoro?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O Timer Operacional desliga o forno automaticamente ao fim do tempo. O Timer Sonoro apenas avisa com um alarme, mas o forno continua ligado.</div></div></div><div class='faq-item'><div class='faq-question'><span>Posso agendar o forno para começar a cozinhar mais tarde?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, através da função Programação Futura do timer digital.</div></div></div><div class='faq-item'><div class='faq-question'><span>Este forno precisa de instalação especial?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>É um forno built-in (embutido), deve ser instalado em nicho apropriado por profissional autorizado, seguindo as normas elétricas.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia do Forno Multifunção?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"fornopizza_p_produto_instalacao", kind:"chapter", categoryId:"fornopizza", navTitle:"Forno de Pizza 16\" · Instalação", icon:"🍕", title:"Instalação e Segurança", kicker:"Forno Pizza · Capítulo 4 de 7 · Instalação", html:"<p>Este produto a gás é para uso exclusivo em ambientes externos e ventilados, assim como a Churrasqueira Invita.</p><h2 class='section-title'>🎧 Áudio · Instalação e Segurança</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Instalação e Segurança</div><div class='media-body'><audio class='custom-audio' id='fpAud2' controls preload='none' src='/media/fornopizza/fornopizza_p_produto_instalacao__audio-instalacao-e-seguranca.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='fpAud2' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='fpAud2' data-rate='1'>1x</button><button class='speed-btn' data-target='fpAud2' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='fpAud2' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='fpAud2' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Instalação e Segurança</div><img src='/media/fornopizza/fornopizza_p_produto_instalacao__infografico-instalacao-e-seguranca.jpg' alt='Infográfico com o guia de instalação do Forno de Pizza Invita' loading='lazy'></div>", quiz:{"question":"Onde o Forno de Pizza Invita pode ser utilizado?","options":["Em qualquer ambiente interno","Exclusivamente em ambientes externos e ventilados","Apenas em cozinhas fechadas","Em qualquer lugar, não há restrição"],"correct":1,"explain":"Assim como a Churrasqueira Invita, é um produto a gás para uso exclusivo em ambientes externos e ventilados."}},

{id:"fornopizza_p_produto_manutencao", kind:"chapter", categoryId:"fornopizza", navTitle:"Forno de Pizza 16\" · Manutenção", icon:"🍕", title:"Manutenção e Limpeza", kicker:"Forno Pizza · Capítulo 5 de 7 · Manutenção", html:"<ul class='styled'><li>Aguarde o forno esfriar completamente antes de qualquer limpeza.</li><li>Remova cinzas e resíduos de farinha da pedra e da base com escova macia.</li><li>Limpe a parte externa em aço inox com pano macio e detergente neutro — nunca use produtos abrasivos.</li><li>Verifique periodicamente a mangueira e as conexões de gás, testando com espuma de sabão.</li><li>Guarde na bolsa de transporte, em local seco, quando não estiver em uso.</li></ul><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/fornopizza/fornopizza_p_produto_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Forno de Pizza Invita' loading='lazy'></div>", quiz:{"question":"O que se deve fazer antes de guardar o Forno de Pizza Invita na bolsa de transporte?","options":["Guardá-lo ainda quente, para economizar tempo","Aguardar esfriar completamente e limpar cinzas e resíduos","Deixar a mangueira de gás conectada","Não é necessário limpar antes de guardar"],"correct":1,"explain":"O forno deve esfriar completamente e ter cinzas e resíduos de farinha removidos antes de ser guardado na bolsa de transporte."}},

{id:"fornopizza_p_glossario", kind:"chapter", categoryId:"fornopizza", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Forno Pizza · Capítulo 6 de 7 · Termos Essenciais", html:"<ul class='styled'><li><strong>Pizza estilo napolitano:</strong> pizza fina, assada em altíssima temperatura (400°C+) por pouquíssimo tempo (60-90 segundos).</li><li><strong>Pedra refratária:</strong> superfície de cocção que retém e transfere calor uniformemente para a base da pizza.</li><li><strong>GLP:</strong> Gás Liquefeito de Petróleo, fornecido em botijão.</li><li><strong>GN:</strong> Gás Natural, fornecido por rede encanada.</li></ul>"},

{id:"fornopizza_p_faq", kind:"chapter", categoryId:"fornopizza", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Forno Pizza · Capítulo 7 de 7 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Posso usar este forno dentro de casa?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. É um produto a gás para uso exclusivo em ambientes externos e ventilados, como churrasqueiras a gás.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quanto tempo leva para assar uma pizza?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Com o forno na temperatura máxima (450°C), uma pizza fina no estilo napolitano assa em cerca de 60 a 90 segundos.</div></div></div><div class='faq-item'><div class='faq-question'><span>O forno é pesado para transportar?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não, pesa apenas 13,6 kg e acompanha bolsa própria de transporte, facilmente carregável por uma pessoa.</div></div></div><div class='faq-item'><div class='faq-question'><span>Funciona com gás de botijão ou só encanado?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Funciona com os dois — GLP (botijão) e GN (encanado), mediante o bico injetor correto.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia do Forno de Pizza?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"microondas_p_produto_manutencao", kind:"chapter", categoryId:"microondas", navTitle:"Micro-ondas 25L · Manutenção", icon:"📡", title:"Manutenção e Limpeza", kicker:"Micro-ondas · Capítulo 5 de 8 · Manutenção", html:"<p>Limpe o interior com pano macio e água morna; nunca use produtos abrasivos ou objetos metálicos dentro do compartimento. Ouça o áudio e veja o infográfico abaixo para o passo a passo completo de manutenção e limpeza deste produto.</p><h2 class='section-title'>🎧 Áudio · Manutenção e Limpeza</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Manutenção e Limpeza</div><div class='media-body'><audio class='custom-audio' id='moAud3' controls preload='none' src='/media/microondas/microondas_p_produto_manutencao__audio-manutencao-e-limpeza.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='moAud3' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='moAud3' data-rate='1'>1x</button><button class='speed-btn' data-target='moAud3' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='moAud3' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='moAud3' data-rate='2'>2x</button></div></div></div><div class='media-block infocard-block'><div class='media-label'>🖼️ Infográfico · Manutenção</div><img src='/media/microondas/microondas_p_produto_manutencao__infografico-manutencao.jpg' alt='Infográfico com o guia de manutenção do Micro-ondas Invita' loading='lazy'></div>", quiz:{"question":"Quando o suporte metálico do Micro-ondas Invita pode ser utilizado?","options":["Em qualquer função, inclusive micro-ondas puro","Apenas nas funções grill ou combinada","Nunca deve ser utilizado","Somente para descongelar"],"correct":1,"explain":"O suporte metálico é exclusivo para a função grill ou combinada — nunca deve ser usado apenas no modo micro-ondas, sob risco de faíscas."}},

{id:"microondas_p_problemas", kind:"chapter", categoryId:"microondas", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Micro-ondas · Capítulo 6 de 8 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Não liga / painel travado</td><td>Trava de segurança ativada</td><td>Desative a trava de segurança no painel</td></tr><tr><td>Prato giratório não gira</td><td>Prato ou suporte mal encaixado</td><td>Verifique se o prato está corretamente apoiado no eixo giratório</td></tr><tr><td>Aquecimento desigual</td><td>Alimento não coberto ou disposto incorretamente</td><td>Distribua o alimento uniformemente e use tampa própria para micro-ondas</td></tr><tr><td>Faíscas dentro do forno</td><td>Uso de utensílios metálicos incorretos no modo micro-ondas</td><td>Use apenas o suporte metálico durante a função grill/combinada — nunca no modo micro-ondas puro</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"microondas_p_glossario", kind:"chapter", categoryId:"microondas", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Micro-ondas · Capítulo 7 de 8 · Termos Essenciais", html:"<ul class='styled'><li><strong>Função Combinada:</strong> programa que executa micro-ondas seguido de grill elétrico, em sequência automática.</li><li><strong>Timer Operacional:</strong> temporizador que desliga o equipamento automaticamente ao final do tempo programado.</li><li><strong>Trava de Segurança:</strong> bloqueio do painel que evita reprogramação ou uso acidental, útil perto de crianças.</li><li><strong>Prato Giratório:</strong> prato de vidro que gira durante o cozimento, garantindo aquecimento uniforme.</li></ul>"},

{id:"microondas_p_faq", kind:"chapter", categoryId:"microondas", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Micro-ondas · Capítulo 8 de 8 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Posso usar louça comum no micro-ondas?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Apenas louças próprias para micro-ondas (sem detalhes metálicos). Nunca utilize recipientes de metal no modo micro-ondas puro.</div></div></div><div class='faq-item'><div class='faq-question'><span>O suporte metálico pode ser usado em qualquer função?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Não. O suporte metálico é exclusivo para a função grill ou combinada — nunca deve ser usado apenas no modo micro-ondas.</div></div></div><div class='faq-item'><div class='faq-question'><span>Quantas funções o micro-ondas tem?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>13 funções: 8 de cozimento por micro-ondas, 2 combinações micro-ondas+grill, 1 função grill, timer operacional e descongelamento.</div></div></div><div class='faq-item'><div class='faq-question'><span>O micro-ondas precisa de instalação especial?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>É um produto built-in (embutido) — recomenda-se instalação por profissional autorizado, em nicho apropriado com ventilação adequada.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia do Micro-ondas Invita?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},

{id:"refrigeradores_p_md522_diferenciais", kind:"chapter", categoryId:"refrigeradores", navTitle:"Multidoor 522L · Diferenciais", icon:"❄️", title:"Diferenciais Comerciais", kicker:"Refrigeradores · Capítulo 7 de 13 · Diferenciais", html:"<p>Conheça os principais diferenciais do <strong>Multidoor 522L</strong> — a base para qualquer argumento de venda ou objeção de cliente.</p><div class='feature-grid'><div class='feature-card'><span class='f-icon'>🧩</span><h4>Instalação Slot-in</h4><p>Integração harmoniosa ao mobiliário, valorizando diferentes estilos de projeto.</p></div><div class='feature-card'><span class='f-icon'>🛡️</span><h4>Inox Antifingerprint</h4><p>Acabamento que reduz marcas de toque e facilita a limpeza.</p></div><div class='feature-card'><span class='f-icon'>⚡</span><h4>Compressor Inverter</h4><p>Maior eficiência energética, funcionamento silencioso, sem necessidade de descongelamento manual.</p></div><div class='feature-card'><span class='f-icon'>🌸</span><h4>Sistema Pure Space</h4><p>Desodorização do freezer, auxiliando na eliminação de odores e conservação dos alimentos.</p></div><div class='feature-card'><span class='f-icon'>🧊</span><h4>Gaveta Flex Temp (Zero Grau)</h4><p>Compartimento com controle de temperatura específico, próximo a 0°C.</p></div><div class='feature-card'><span class='f-icon'>🔋</span><h4>Memória de Queda de Energia</h4><p>Retoma as configurações programadas automaticamente após a energia voltar.</p></div></div><h2 class='section-title'>🎬 Vídeo · Diferenciais</h2><div class='media-block'><div class='media-label'>▶️ Vídeo · Diferenciais Refrigerador Multidoor</div><video controls preload='metadata'><source src='/media/refrigeradores/refrigeradores_p_md522_diferenciais__video-diferenciais-refrigerador-multidoo.mp4' type='video/mp4'></video></div><h2 class='section-title'>🎧 Áudio · Diferenciais</h2><div class='media-block'><div class='media-label'>🎧 Áudio · Diferenciais</div><div class='media-body'><audio class='custom-audio' id='rfmdAud1' controls preload='none' src='/media/refrigeradores/refrigeradores_p_md522_diferenciais__audio-diferenciais.webm'></audio><div class='speed-controls'><span class='speed-label'>Velocidade:</span><button class='speed-btn' data-target='rfmdAud1' data-rate='0.75'>0.75x</button><button class='speed-btn active' data-target='rfmdAud1' data-rate='1'>1x</button><button class='speed-btn' data-target='rfmdAud1' data-rate='1.25'>1.25x</button><button class='speed-btn' data-target='rfmdAud1' data-rate='1.5'>1.5x</button><button class='speed-btn' data-target='rfmdAud1' data-rate='2'>2x</button></div></div></div>", quiz:{"question":"O que o Sistema Pure Space do Refrigerador Multidoor 522L auxilia a fazer?","options":["Economizar energia elétrica","Desodorizar o freezer e ajudar na conservação dos alimentos","Aumentar a capacidade de armazenamento","Controlar a temperatura pelo celular"],"correct":1,"explain":"O Pure Space realiza a desodorização do freezer, auxiliando na eliminação de odores e na conservação dos alimentos."}},

{id:"refrigeradores_p_problemas", kind:"chapter", categoryId:"refrigeradores", navTitle:"Solução de Problemas", icon:"🛠️", title:"Solução de Problemas", kicker:"Refrigeradores · Capítulo 11 de 13 · Diagnóstico Rápido", html:"<div class='table-scroll'><table class='spec-table'><tr><th>Problema</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Não gela o suficiente</td><td>Porta aberta com frequência, ambiente muito quente, ventilação obstruída</td><td>Verifique o espaçamento de instalação e a frequência de abertura da porta</td></tr><tr><td>Formação de gelo (mesmo com No Frost)</td><td>Porta mal vedada, borracha danificada</td><td>Verifique a vedação da porta e limpe a borracha</td></tr><tr><td>Ruído excessivo</td><td>Produto desnivelado</td><td>Ajuste os pés niveladores</td></tr><tr><td>Alarme de porta aberta constante</td><td>Porta não fechando completamente</td><td>Verifique obstruções e o nivelamento do produto</td></tr><tr><td>Consumo de energia acima do esperado</td><td>Modo Eco/Férias não configurado, porta aberta com frequência</td><td>Ative o Modo Eco quando aplicável e minimize a abertura da porta</td></tr></table></div><div class='callout info'><span class='c-icon'>📞</span><p>SAC Invita: <strong>0800 723 1202</strong> · sac@invitacasa.com.br</p></div>"},

{id:"refrigeradores_p_glossario", kind:"chapter", categoryId:"refrigeradores", navTitle:"Glossário", icon:"📖", title:"Glossário Técnico", kicker:"Refrigeradores · Capítulo 12 de 13 · Termos Essenciais", html:"<ul class='styled'><li><strong>No Frost / Total No Frost:</strong> tecnologia que impede a formação de gelo, eliminando a necessidade de descongelamento manual.</li><li><strong>Bottom Freezer:</strong> configuração com o freezer na parte inferior e o refrigerador (mais usado) na parte superior.</li><li><strong>Multidoor:</strong> refrigerador com 4 portas independentes (2 superiores + 2 inferiores).</li><li><strong>Slot-in:</strong> instalação que encaixa o refrigerador entre módulos de marcenaria, integrado ao mobiliário.</li><li><strong>Multi Air Flow:</strong> sistema de circulação de ar frio uniforme por todos os compartimentos.</li><li><strong>Super Freezing / Super Cooling:</strong> funções que reduzem intensivamente a temperatura por tempo limitado, para congelamento/resfriamento rápido.</li><li><strong>Modo Férias/Holiday:</strong> reduz o consumo de energia durante longos períodos sem uso do refrigerador.</li><li><strong>Gaveta Flex Temp:</strong> compartimento com temperatura ajustável, podendo funcionar próximo a 0°C.</li></ul>"},

{id:"refrigeradores_p_faq", kind:"chapter", categoryId:"refrigeradores", navTitle:"Perguntas Frequentes", icon:"💬", title:"Perguntas Frequentes", kicker:"Refrigeradores · Capítulo 13 de 13 · FAQ", html:"<div class='faq-item'><div class='faq-question'><span>Qual a diferença entre Bottom Freezer e Multidoor?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>O Bottom Freezer (360L) tem 2 portas — freezer embaixo, refrigerador em cima. O Multidoor (522L) tem 4 portas independentes e maior capacidade, com instalação slot-in.</div></div></div><div class='faq-item'><div class='faq-question'><span>Os dois modelos são No Frost?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, ambos têm tecnologia No Frost — não é necessário descongelar manualmente em nenhum dos dois.</div></div></div><div class='faq-item'><div class='faq-question'><span>O que é a instalação Slot-in do Multidoor?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>É uma instalação que permite o refrigerador se integrar entre módulos de marcenaria, ficando alinhado ao mobiliário da cozinha.</div></div></div><div class='faq-item'><div class='faq-question'><span>A porta do Bottom Freezer pode ser invertida?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>Sim, o modelo Bottom Freezer 360L acompanha kit para reversão de portas, adequando-se a diferentes projetos de instalação.</div></div></div><div class='faq-item'><div class='faq-question'><span>Qual o prazo de garantia dos Refrigeradores Invita?</span><span class='faq-plus'>+</span></div><div class='faq-answer'><div class='faq-answer-inner'>90 dias de garantia legal + 21 meses de garantia contratual adicional, totalizando 24 meses. Veja o capítulo de Garantia no final do caderno para todas as condições.</div></div></div>"},
